<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../../assets/images/clinic/Bethlehem_Logo-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
    <title>Forgot Password | Bethlehem Animal Clinic</title>
    <link rel="stylesheet" href="../../css/output.css" />
    <link rel="stylesheet" href="../../css/custom.css?v=site-assets-20261001&release=20261001" />
    <link rel="stylesheet" href="../../css/components/verification-code.css?v=verification-css-20261005" />
  </head>
  <body class="min-h-screen bg-slate-100 px-4 py-8">
    <div class="mx-auto flex min-h-[calc(100vh-4rem)] max-w-2xl items-center justify-center">
      <div class="w-full rounded-[1.75rem] bg-white shadow-[0_18px_48px_rgba(15,23,42,0.12)]">
        <div class="relative px-8 py-10 sm:px-10">
          <button id="forgotBack" type="button" class="absolute hidden text-[#315b7e] transition hover:text-[#274a66]" style="left: 1.5rem; top: 2.5rem; width: 2.75rem; height: 2.75rem; padding: .625rem" aria-label="Go back">
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7M5 12h14" /></svg>
          </button>
          <div class="mb-8 text-center">
            <img
              class="mx-auto mb-4 h-16 w-auto"
              src="../../assets/images/clinic/Bethlehem_Logo-256.png"
              alt="Bethlehem Animal Clinic Logo"
            />
            <h1 id="forgotTitle" class="text-3xl font-bold leading-tight text-slate-800">Forgot Password</h1>
            <p id="forgotDescription" class="mt-4 text-sm leading-6 text-slate-500">Enter your email address to receive a verification code.</p>
            <p id="verifyDescription" class="mt-4 hidden text-sm leading-6 text-slate-500">We sent a 6-digit verification code to <span id="verifyEmail" class="font-semibold text-slate-800"></span>.</p>
          </div>

          <form id="forgotPasswordForm" class="space-y-5">
            <div>
              <label for="resetEmail" class="mb-2 block text-base font-semibold text-[#1e3a5f]">Email</label>
              <input
                id="resetEmail"
                name="email"
                type="email"
                autocomplete="email"
                class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-4 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/10"
                required
              />
            </div>

            <button
              id="forgotPasswordSubmit"
              type="submit"
              class="w-full rounded-2xl bg-[#315b7e] px-4 py-4 text-base font-semibold text-white transition hover:bg-[#274a66] disabled:cursor-not-allowed disabled:opacity-70"
            >
              <span id="forgotPasswordSubmitLabel">Send Code</span>
            </button>
          </form>

          <form id="verifyCodeForm" class="hidden space-y-5" novalidate>
            <div>
              <label for="verificationCode" class="mb-3 block text-center text-base font-semibold text-[#1e3a5f]">Verification Code</label>
              <div id="verificationCodeCells" class="verification-code-cells">
                <input id="verificationCode" class="verification-code-input" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" aria-describedby="verifyCodeMessage" required />
                <span class="verification-code-cell" aria-hidden="true"></span>
                <span class="verification-code-cell" aria-hidden="true"></span>
                <span class="verification-code-cell" aria-hidden="true"></span>
                <span class="verification-code-cell" aria-hidden="true"></span>
                <span class="verification-code-cell" aria-hidden="true"></span>
                <span class="verification-code-cell" aria-hidden="true"></span>
              </div>
              <div id="verifyCodeMessage" class="hidden rounded-2xl border px-4 py-3 text-sm" role="alert"></div>
            </div>
            <button id="verifyCodeSubmit" type="submit" class="w-full rounded-2xl bg-[#315b7e] px-4 py-4 text-base font-semibold text-white transition hover:bg-[#274a66] disabled:cursor-not-allowed disabled:opacity-70">Continue</button>
            <div class="text-center text-sm text-slate-500">Didn't receive the code? <button id="resendCode" type="button" class="font-semibold text-[#315b7e] transition hover:text-[#274a66] disabled:cursor-not-allowed disabled:opacity-70">Resend Code</button></div>
          </form>

          <form id="resetPasswordForm" class="hidden space-y-5" autocomplete="off" novalidate>
            <div>
              <label for="newPassword" class="mb-2 block text-base font-semibold text-[#1e3a5f]">New Password</label>
              <div class="relative">
                <input id="newPassword" type="password" autocomplete="new-password" data-lpignore="true" data-1p-ignore="true" aria-describedby="passwordRequirements newPasswordMessage" class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-4 pr-12 text-base text-slate-800 outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/10" required />
                <button id="toggleNewPassword" type="button" class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-slate-400 transition hover:text-[#315b7e]" aria-label="Show new password">
                  <svg class="new-password-icon-closed h-5 w-5 fill-current" viewBox="0 0 256 256" aria-hidden="true"><use href="../../assets/icons/phosphor.svg#eye-slash"></use></svg>
                  <svg class="new-password-icon-open hidden h-5 w-5 fill-current" viewBox="0 0 256 256" aria-hidden="true"><use href="../../assets/icons/phosphor.svg#eye"></use></svg>
                </button>
              </div>
              <p id="passwordRequirements" class="mt-2 text-xs leading-5 text-slate-500">At least 12 characters with uppercase, lowercase, a number, and a symbol.</p>
              <div id="newPasswordMessage" class="hidden" role="alert"></div>
            </div>
            <div>
              <label for="confirmNewPassword" class="mb-2 block text-base font-semibold text-[#1e3a5f]">Confirm New Password</label>
              <div class="relative">
                <input id="confirmNewPassword" type="password" autocomplete="new-password" data-lpignore="true" data-1p-ignore="true" aria-describedby="confirmPasswordMessage" class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-4 pr-12 text-base text-slate-800 outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/10" required />
                <button id="toggleConfirmNewPassword" type="button" class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-slate-400 transition hover:text-[#315b7e]" aria-label="Show password confirmation">
                  <svg class="confirm-password-icon-closed h-5 w-5 fill-current" viewBox="0 0 256 256" aria-hidden="true"><use href="../../assets/icons/phosphor.svg#eye-slash"></use></svg>
                  <svg class="confirm-password-icon-open hidden h-5 w-5 fill-current" viewBox="0 0 256 256" aria-hidden="true"><use href="../../assets/icons/phosphor.svg#eye"></use></svg>
                </button>
              </div>
              <div id="confirmPasswordMessage" class="hidden" role="alert"></div>
            </div>
            <div id="resetPasswordMessage" class="hidden rounded-2xl border px-4 py-3 text-sm" role="alert"></div>
            <button id="resetPasswordSubmit" type="submit" class="w-full rounded-2xl bg-[#315b7e] px-4 py-4 text-base font-semibold text-white transition hover:bg-[#274a66] disabled:cursor-not-allowed disabled:opacity-70">Reset Password</button>
          </form>

          <div id="backToSignIn" class="mt-7 text-center text-sm">
            <a href="./sign-in.html" class="font-semibold text-[#315b7e] transition hover:text-[#274a66]">Back to Sign In</a>
          </div>
        </div>
      </div>
    </div>

    <script src="../../scripts/api.js?v=customer-cache-20261005-v1&auth=session-scope-20261006&session=lock-20261018" defer></script>
    <script src="../../scripts/auth/verification-code.js?v=signup-code-20261005" defer></script>
    <script src="../../scripts/auth/forgot-password.js?v=signup-code-20261005&release=reset-fixed-mask-20261005" defer></script>
  </body>
</html>
