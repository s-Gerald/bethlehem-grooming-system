<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../../assets/images/clinic/Bethlehem_Logo-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
    <title>Forgot Password | Bethlehem Animal Clinic</title>
    <link rel="stylesheet" href="../../css/output.css" />
    <link rel="stylesheet" href="../../css/custom.css?v=site-assets-20261001&release=20261001&grooming=actual-20261026" />
    <link rel="stylesheet" href="../../css/components/verification-code.css?v=recovery-ui-20261022b" />
  </head>
  <body class="verification-page password-recovery-page">
    <main class="verification-layout">
      <div class="verification-card">
          <img class="verification-logo" src="../../assets/images/clinic/Bethlehem_Logo-256.png" alt="Bethlehem Animal Clinic Logo" width="56" height="56" />
          <div class="verification-heading">
            <h1 id="forgotTitle">Forgot Password</h1>
            <p id="forgotDescription">Enter your email address to request a verification code.</p>
            <p id="verifyDescription" class="hidden">Enter the 6-digit code sent to</p>
            <p id="verifyEmail" class="hidden verification-email"></p>
          </div>

          <form id="forgotPasswordForm" class="space-y-5">
            <div>
              <label for="resetEmail" class="mb-2 block text-sm font-semibold text-slate-800">Email</label>
              <input
                id="resetEmail"
                name="email"
                type="email"
                autocomplete="email"
                class="recovery-input"
                aria-describedby="forgotPasswordMessage"
                required
              />
            </div>

            <button
              id="forgotPasswordSubmit"
              type="submit"
              class="verification-primary"
            >
              <span id="forgotPasswordSubmitLabel">Send Code</span>
            </button>
            <div id="forgotPasswordMessage" class="hidden verification-message" role="alert"></div>
          </form>

          <div id="passwordResetConfirmation" class="hidden">
            <button id="enterResetCode" type="button" class="verification-primary" aria-describedby="forgotDescription">Enter code</button>
          </div>

          <form id="verifyCodeForm" class="hidden space-y-5" novalidate>
            <div>
              <label for="verificationCode" class="sr-only">6-digit verification code</label>
              <div id="verificationCodeCells" class="verification-code-cells">
                <input id="verificationCode" class="verification-code-input" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" aria-describedby="verifyDescription verifyEmail verifyCodeMessage" required />
                <span class="verification-code-cell" aria-hidden="true"></span>
                <span class="verification-code-cell" aria-hidden="true"></span>
                <span class="verification-code-cell" aria-hidden="true"></span>
                <span class="verification-code-cell" aria-hidden="true"></span>
                <span class="verification-code-cell" aria-hidden="true"></span>
                <span class="verification-code-cell" aria-hidden="true"></span>
              </div>
              <div id="verifyCodeMessage" class="hidden verification-message" role="alert"></div>
            </div>
            <button id="verifyCodeSubmit" type="submit" class="verification-primary" disabled>Continue</button>
            <div class="verification-resend">
              <p>Didn't receive the code?</p>
              <button id="resendCode" type="button" class="verification-link">Resend code</button>
            </div>
          </form>

          <form id="resetPasswordForm" class="hidden space-y-5" autocomplete="off" novalidate>
            <div>
              <label for="newPassword" class="mb-2 block text-sm font-semibold text-slate-800">New Password</label>
              <div class="relative">
                <input id="newPassword" type="password" autocomplete="new-password" data-lpignore="true" data-1p-ignore="true" aria-describedby="passwordRequirements newPasswordMessage" class="recovery-input recovery-password" required />
                <button id="toggleNewPassword" type="button" class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-slate-400 transition hover:text-[#315b7e]" aria-label="Show new password">
                  <svg class="new-password-icon-closed h-5 w-5 fill-current" viewBox="0 0 256 256" aria-hidden="true"><use href="../../assets/icons/phosphor.svg#eye-slash"></use></svg>
                  <svg class="new-password-icon-open hidden h-5 w-5 fill-current" viewBox="0 0 256 256" aria-hidden="true"><use href="../../assets/icons/phosphor.svg#eye"></use></svg>
                </button>
              </div>
              <p id="passwordRequirements" class="mt-2 text-xs leading-5 text-slate-500">At least 12 characters with uppercase, lowercase, a number, and a symbol.</p>
              <div id="newPasswordMessage" class="hidden" role="alert"></div>
            </div>
            <div>
              <label for="confirmNewPassword" class="mb-2 block text-sm font-semibold text-slate-800">Confirm New Password</label>
              <div class="relative">
                <input id="confirmNewPassword" type="password" autocomplete="new-password" data-lpignore="true" data-1p-ignore="true" aria-describedby="confirmPasswordMessage" class="recovery-input recovery-password" required />
                <button id="toggleConfirmNewPassword" type="button" class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-slate-400 transition hover:text-[#315b7e]" aria-label="Show password confirmation">
                  <svg class="confirm-password-icon-closed h-5 w-5 fill-current" viewBox="0 0 256 256" aria-hidden="true"><use href="../../assets/icons/phosphor.svg#eye-slash"></use></svg>
                  <svg class="confirm-password-icon-open hidden h-5 w-5 fill-current" viewBox="0 0 256 256" aria-hidden="true"><use href="../../assets/icons/phosphor.svg#eye"></use></svg>
                </button>
              </div>
              <div id="confirmPasswordMessage" class="hidden" role="alert"></div>
            </div>
            <div id="resetPasswordMessage" class="hidden verification-message" role="alert"></div>
            <button id="resetPasswordSubmit" type="submit" class="verification-primary">Reset Password</button>
          </form>

          <div id="backToSignIn" class="verification-resend">
            <button id="forgotBack" type="button" class="hidden verification-link mb-3 w-full">Use another email</button>
            <p id="registrationRecovery" class="mb-3 text-slate-500">Haven't finished signing up? <a href="./verify-email.html?recover=1" class="verification-link">Complete registration</a></p>
            <a href="./sign-in.html" class="verification-link">Back to Sign In</a>
          </div>
      </div>
    </main>

    <script src="../../scripts/api.js?v=registration-recovery-20261022&auth=session-scope-20261006&session=lock-20261018&auth-races=20261024&security=single-session-20261025&grooming=actual-20261026" defer></script>
    <script src="../../scripts/auth/verification-code.js?v=signup-code-20261005" defer></script>
    <script src="../../scripts/auth/forgot-password.js?v=recovery-confirmation-20261022" defer></script>
  </body>
</html>
