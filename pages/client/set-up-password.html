<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../../assets/images/clinic/Bethlehem_Logo-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
    <title>Set Up Your Password | Bethlehem Animal Clinic</title>
    <link rel="stylesheet" href="../../css/output.css" />
    <link rel="stylesheet" href="../../css/custom.css?ui=20260915-password-reveal&release=20261001&grooming=actual-20261026" />
  </head>
  <body class="min-h-screen bg-slate-100 px-4 py-8">
    <div class="mx-auto flex min-h-[calc(100vh-4rem)] max-w-2xl items-center justify-center">
      <div class="w-full rounded-[1.75rem] bg-white shadow-[0_18px_48px_rgba(15,23,42,0.12)]">
        <div class="px-8 py-10 sm:px-10">
          <div class="mb-8 text-center">
            <img
              class="mx-auto mb-4 h-16 w-auto"
              src="../../assets/images/clinic/Bethlehem_Logo-256.png"
              alt="Bethlehem Animal Clinic Logo"
            />
            <h1 class="text-3xl font-bold leading-tight text-slate-800">Set Up Your Password</h1>
            <p id="setupAccountDescription" class="hidden mt-4 text-sm leading-6 text-slate-500">Create a password to secure the account linked to <strong id="setupAccountEmail" class="break-all"></strong>.</p>
          </div>

          <form id="setupPasswordForm" class="hidden space-y-5" novalidate>
            <div>
              <label for="setupUsername" class="mb-2 block text-base font-semibold text-[#1e3a5f]">Username (optional)</label>
              <input
                id="setupUsername"
                name="username"
                type="text"
                autocomplete="username"
                maxlength="50"
                placeholder="Enter a username"
                aria-describedby="setupUsernameMessage"
                class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-4 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/10"
              />
              <p id="setupUsernameMessage" class="hidden" role="alert"></p>
            </div>

            <div>
              <label for="setupNewPassword" class="mb-2 block text-base font-semibold text-[#1e3a5f]">New password</label>
              <div class="relative">
                <input
                  id="setupNewPassword"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  class="custom-password-input w-full rounded-2xl border border-slate-300 bg-white px-4 py-4 pr-12 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/10"
                  required
                />
                <button id="toggleSetupPassword" type="button" class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-slate-400 transition hover:text-[#315b7e]" aria-label="Show new password" title="Show new password">
                  <svg class="setup-password-icon-closed h-5 w-5 fill-current" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#eye-slash"></use></svg>
                  <svg class="setup-password-icon-open hidden h-5 w-5 fill-current" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#eye"></use></svg>
                </button>
              </div>
            </div>

            <div>
              <label for="setupConfirmPassword" class="mb-2 block text-base font-semibold text-[#1e3a5f]">Confirm new password</label>
              <div class="relative">
                <input
                  id="setupConfirmPassword"
                  name="password_confirmation"
                  type="password"
                  autocomplete="new-password"
                  class="custom-password-input w-full rounded-2xl border border-slate-300 bg-white px-4 py-4 pr-12 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/10"
                  required
                />
                <button id="toggleSetupConfirmation" type="button" class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-slate-400 transition hover:text-[#315b7e]" aria-label="Show password confirmation" title="Show password confirmation">
                  <svg class="setup-confirmation-icon-closed h-5 w-5 fill-current" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#eye-slash"></use></svg>
                  <svg class="setup-confirmation-icon-open hidden h-5 w-5 fill-current" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#eye"></use></svg>
                </button>
              </div>
            </div>

            <div id="setupPasswordMessage" class="hidden rounded-2xl border px-4 py-3 text-sm" role="alert"></div>

            <button
              id="setupPasswordSubmit"
              type="submit"
              disabled
              class="w-full rounded-2xl bg-[#315b7e] px-4 py-4 text-base font-semibold text-white transition hover:bg-[#274a66] disabled:cursor-not-allowed disabled:opacity-70"
            >
              <span id="setupPasswordSubmitLabel">Create Account</span>
            </button>
          </form>

          <div id="setupExpiredLink" class="hidden text-center">
            <div id="setupExpiredLinkMessage" class="rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">This setup link has expired. Request a new link to finish setting up your account.</div>
            <button id="requestNewSetupLink" type="button" class="mt-5 inline-flex w-full items-center justify-center rounded-2xl bg-[#315b7e] px-4 py-4 text-base font-semibold text-white transition hover:bg-[#274a66] disabled:cursor-not-allowed disabled:opacity-70">Request New Setup Link</button>
          </div>

          <div id="setupInvalidLink" class="hidden text-center">
            <div class="rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">This setup link is no longer valid.</div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../scripts/api.js?v=customer-cache-20261005-v1&release=staff-username-setup-20261005&auth=session-scope-20261006&session=lock-20261018&auth-races=20261024&security=single-session-20261025&grooming=actual-20261026&availability=20261027&names=20261028-v2&remember=20261029" defer></script>
    <script src="../../scripts/auth/set-up-password.js?v=staff-setup-link-renewal-20260923&release=staff-setup-fixed-mask-20261005" defer></script>
  </body>
</html>
