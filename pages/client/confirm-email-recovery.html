<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
    <title>Confirm Email Recovery | Bethlehem Animal Clinic</title>
    <link rel="icon" type="image/png" href="../../assets/images/clinic/Bethlehem_Logo-256.png" />
    <link rel="stylesheet" href="../../css/output.css?recovery=20261025-3&availability=20261027" />
    <link rel="stylesheet" href="../../css/custom.css?recovery=20261025-3&grooming=actual-20261026" />
  </head>
  <body class="min-h-screen bg-slate-100 px-4 py-8">
    <main class="mx-auto flex min-h-[calc(100vh-4rem)] max-w-lg items-center justify-center">
      <div class="w-full rounded-[1.75rem] bg-white px-6 py-8 shadow-[0_18px_48px_rgba(15,23,42,0.12)] sm:px-10 sm:py-10">
        <img class="mx-auto mb-5 h-16 w-auto" src="../../assets/images/clinic/Bethlehem_Logo-256.png" alt="Bethlehem Animal Clinic" />
        <h1 id="recoveryTitle" tabindex="-1" class="text-center text-3xl font-bold leading-tight text-slate-800">Confirm Email Recovery</h1>
        <p id="recoveryMessage" class="mt-5 text-sm text-slate-600" role="status" aria-live="polite">Checking recovery link...</p>
        <form id="emailRecoveryForm" class="mt-6 hidden space-y-5" novalidate>
          <div><label for="recoveryEmail" class="mb-2 block text-sm font-semibold text-[#1e3a5f]">New Email</label><input id="recoveryEmail" type="email" readonly class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600" /></div>
          <div>
            <label for="recoveryPassword" class="mb-2 block text-sm font-semibold text-[#1e3a5f]">Current account password</label>
            <div class="relative">
              <input id="recoveryPassword" type="password" required autocomplete="current-password" aria-describedby="recoveryError" class="custom-password-input w-full rounded-2xl border border-slate-300 bg-white px-4 py-3 pr-12 text-base text-slate-800 outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/10" />
              <button id="recoveryReveal" type="button" aria-label="Show current account password" aria-pressed="false" class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-slate-400 hover:text-[#315b7e]"><svg class="h-5 w-5 fill-current" viewBox="0 0 256 256" aria-hidden="true"><use id="recoveryEye" href="../../assets/icons/phosphor.svg#eye-slash"></use></svg></button>
            </div>
            <p id="recoveryError" class="mt-2 hidden text-sm font-semibold text-red-600" role="alert"></p>
          </div>
          <p class="text-sm text-slate-500">Forgot your password? Contact the clinic administrator.</p>
          <button id="recoverySubmit" type="submit" disabled class="w-full rounded-2xl bg-[#315b7e] px-4 py-3 text-base font-semibold text-white transition hover:bg-[#274a66] disabled:opacity-60">Confirm Email Change</button>
        </form>
        <a id="recoverySignIn" href="sign-in.html" class="mt-6 block rounded-2xl border border-[#c9d9e8] px-4 py-3 text-center text-sm font-semibold text-[#315b7e] hover:bg-slate-50">Back to Sign In</a>
      </div>
    </main>
    <script src="../../scripts/api.js?v=admin-email-recovery-20261025&recovery=20261025-3&grooming=actual-20261026&availability=20261027" defer></script>
    <script src="../../scripts/auth/email-recovery.js?recovery=20261025-3" defer></script>
  </body>
</html>
