    <script src="../../scripts/api.js?v=customer-cache-20261005-v1&auth=session-scope-20261006&health=20261016&session=lock-20261018&phone=20261025-sms&auth-races=20261024&security=single-session-20261025&grooming=actual-20261026&availability=20261027&names=20261028-v2"></script>
    <script type="module">
      import { clinicVisitFields, healthDate } from "../../scripts/components/customer-health-records.js?v=20261016";
      function scheduleCustomerHistoryIdleTask(task) {
        if (typeof window.requestIdleCallback === "function") {
          window.requestIdleCallback(task, { timeout: 1200 });
          return;
        }

        window.setTimeout(task, 200);
      }

      // ── Sidebar (mobile) ──────────────────────────────────────────────────
      const mobileSidebarQuery = window.matchMedia("(max-width: 1180px)");
      const sidebarToggle   = document.getElementById("clientSidebarToggle");
      const sidebarClose    = document.getElementById("clientSidebarClose");
      const sidebarBackdrop = document.getElementById("clientSidebarBackdrop");
      const sidebar         = document.getElementById("clientSidebar");
      const sidebarLinks    = sidebar.querySelectorAll("a");

      function setSidebarState(isOpen) {
        document.body.classList.toggle("client-sidebar-open", isOpen);
        sidebarToggle.setAttribute("aria-expanded", String(isOpen));
        sidebarToggle.setAttribute("aria-label", isOpen ? "Close navigation menu" : "Open navigation menu");
      }

      function closeSidebar() { setSidebarState(false); }
      function toggleSidebar() {
        if (!mobileSidebarQuery.matches) return;
        setSidebarState(!document.body.classList.contains("client-sidebar-open"));
      }

      setSidebarState(false);
      sidebarToggle.addEventListener("click", toggleSidebar);
      sidebarClose.addEventListener("click", closeSidebar);
      sidebarBackdrop.addEventListener("click", closeSidebar);
      sidebarLinks.forEach(link => link.addEventListener("click", closeSidebar));
      document.addEventListener("keydown", e => { if (e.key === "Escape") closeSidebar(); });
      mobileSidebarQuery.addEventListener("change", e => { if (!e.matches) closeSidebar(); });

      // ── Auth: load profile ────────────────────────────────────────────────
      const loadCustomerProfile = async () => {
        try {
          const { user } = await API.getMe("customer");
          const firstName = user.first_name || "";
          const lastName  = user.last_name  || "";
          document.getElementById("clientProfileName").textContent =
            `${firstName} ${lastName}`.trim() || "Customer";
          document.getElementById("clientProfileInitials").textContent =
            ((firstName[0] || "") + (lastName[0] || "")).toUpperCase() || "--";
        } catch (error) {
          if (API.isAuthenticationError(error) || !API.hasAuthenticatedSession("customer")) {
            API.redirectToSignIn();
          } else {
            console.error("Unable to load the customer profile.", error);
          }
        }
      };

      document.getElementById("clientLogoutBtn").addEventListener("click", async () => {
        try { await API.logout("customer"); } finally {
          API.redirectToSignIn({ replace: true });
        }
      });

      // ── History ──────────────────────────────────────────────────
      const historyList     = document.getElementById("historyList");
      const historyLoadingScreen = document.getElementById("historyLoadingScreen");
      const historyContent = document.getElementById("historyContent");
      const historySummary  = document.getElementById("historySummary");
      const searchInput     = document.getElementById("historySearch");
      const dateFilter      = document.getElementById("historyDateFilter");
      const serviceFilter   = document.getElementById("historyServiceFilter");
      const clearBtn        = document.getElementById("historyClearFilters");

      let allHistory = [];
      let historyLoadState = "idle";
      let historyLoadPromise = null;

      function showHistoryContent() {
        historyLoadingScreen.classList.add("hidden");
        historyContent.classList.remove("hidden");
        historyContent.removeAttribute("inert");
        historyContent.removeAttribute("aria-hidden");
      }

      let groomingHistory = [];
      let clinicHistory = [];

      function updateHistory() {
        allHistory = [
          ...groomingHistory.flatMap((booking) => {
            const pets = Array.isArray(booking.pets) ? booking.pets : [];
            return (pets.length ? pets : [null]).map((pet) => ({
              type: "grooming", date: booking.booking_date, reference: booking.booking_reference,
              pet, booking,
            }));
          }),
          ...clinicHistory.map((record) => ({
            type: "clinic", date: record.appointment_date, reference: record.appointment_reference,
            pet: record.pet, record,
          })),
        ].sort((left, right) => String(right.date || "").localeCompare(String(left.date || "")));
        applyFilters();
      }

      function loadHistory() {
        if (historyLoadState === "loaded") return Promise.resolve(allHistory);
        if (historyLoadPromise) return historyLoadPromise;
        historyLoadState = "loading";
        document.getElementById("historyLoadError").classList.add("hidden");
        const retry = document.getElementById("historyRetry");
        retry.disabled = true;
        historyLoadPromise = (async () => {
          const results = await Promise.allSettled([
            API.loadCustomerData("/booking/history", () => API.getBookingHistory(), (data) => {
              groomingHistory = data.history || [];
              updateHistory();
              showHistoryContent();
            }),
            API.loadCustomerData("/clinic/history", () => API.getCustomerClinicHistory(), (data) => {
              clinicHistory = data.medical_records || [];
              updateHistory();
              showHistoryContent();
            }),
          ]);
          const failures = results.flatMap((result, index) => result.status === "rejected" ? [index === 0 ? "Grooming" : "Clinic"] : []);
          historyLoadState = failures.length ? "error" : "loaded";
          if (failures.length) {
            document.getElementById("historyLoadErrorText").textContent = `${failures.join(" and ")} history could not be loaded.`;
            document.getElementById("historyLoadError").classList.remove("hidden");
          }
          updateHistory();
          showHistoryContent();
          return allHistory;
        })().finally(() => {
          historyLoadPromise = null;
          retry.disabled = false;
        });
        return historyLoadPromise;
      }

      function applyFilters() {
        const search = searchInput.value.trim().toLowerCase();
        const date = dateFilter.value;
        const type = serviceFilter.value;
        const filtered = allHistory.filter((event) =>
          (type === "all" || event.type === type)
          && (!date || event.date === date)
          && (!search || String(event.reference || "").toLowerCase().includes(search)
            || String(event.pet?.pet_name || "").toLowerCase().includes(search)),
        );
        renderHistory(filtered);
      }

      function renderHistory(records) {
        historySummary.textContent = records.length ? `${records.length} record${records.length !== 1 ? "s" : ""} found` : "";
        if (!records.length) {
          historyList.innerHTML = historyLoadState === "error" && !allHistory.length ? "" : `
            <div class="py-16 text-center">
              <svg class="mx-auto h-12 w-12 fill-current text-slate-300" viewBox="0 0 256 256" aria-hidden="true"><use href="../../assets/icons/phosphor.svg#clipboard-text"></use></svg>
              <p class="mt-4 text-sm text-portal-muted">No history found.</p>
            </div>`;
          return;
        }
        historyList.innerHTML = `<div class="space-y-3">${records.map(buildHistoryCard).join("")}</div>`;
      }

      function escapeHistoryHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function historyDateTimeParts(timestamp) {
        if (!timestamp) return null;
        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) return null;
        const timeZone = "Asia/Manila";
        return {
          date: new Intl.DateTimeFormat("en-PH", { timeZone, month: "short", day: "numeric", year: "numeric" }).format(date),
          time: new Intl.DateTimeFormat("en-PH", { timeZone, hour: "numeric", minute: "2-digit", hour12: true }).format(date),
        };
      }

      function historyDateTime(timestamp) {
        const parts = historyDateTimeParts(timestamp);
        return parts ? `${parts.date} &middot; ${parts.time}` : "Not recorded";
      }

      function groomingInterval(startTimestamp, finishTimestamp) {
        const start = historyDateTimeParts(startTimestamp);
        const finish = historyDateTimeParts(finishTimestamp);
        if (start && finish && start.date === finish.date) {
          return `${start.date} &middot; ${start.time}–${finish.time}`;
        }
        if (start && finish) {
          return `${start.date} &middot; ${start.time} to ${finish.date} &middot; ${finish.time}`;
        }
        if (start) return `Started ${start.date} &middot; ${start.time}; finish not recorded`;
        if (finish) return `Finished ${finish.date} &middot; ${finish.time}; start not recorded`;
        return "Times not recorded";
      }

      function groomingOutcome(status) {
        const outcomes = {
          expired: ["Expired", "bg-slate-100 text-slate-600"],
          no_show: ["No Show", "bg-slate-100 text-slate-600"],
        };
        return outcomes[status] || ["Completed", "bg-emerald-50 text-emerald-700"];
      }

      function historyPetIcon(pet) {
        const species = String(pet?.species || "").toLowerCase();
        return species === "dog" ? "dog" : species === "cat" ? "cat" : "paw-print";
      }

      function petGroomingTimes(booking, pet) {
        const useBookingTimes = !pet || Number(booking.number_of_pets) === 1;
        return {
          start: pet?.grooming_started_timestamp || (useBookingTimes ? booking.grooming_started_timestamp : null),
          finish: pet?.grooming_finished_timestamp || (useBookingTimes ? booking.grooming_finished_timestamp : null),
        };
      }

      function historyServiceLines(booking, pet) {
        const settled = booking.paid && booking.payment_summary?.status === "paid"
          ? booking.payment_summary.pets?.find((item) => Number(item.booking_pet_id) === Number(pet?.booking_pet_id))
            || (Number(booking.number_of_pets) === 1 ? booking.payment_summary.pets?.[0] : null)
          : null;
        // Final service names describe care provided; billing amounts stay out of History.
        return Array.isArray(settled?.service_breakdown)
          ? settled.service_breakdown.filter((line) => line.label)
          : (pet?.services || []).filter((service) => service.service_name).map((service) => ({ label: service.service_name }));
      }

      function historyServices(booking, pet) {
        return historyServiceLines(booking, pet).map((line) => line.label);
      }

      function buildHistoryCard(event) {
        const clinic = event.type === "clinic";
        const [outcomeLabel, outcomeClasses] = clinic
          ? ["Completed", "bg-emerald-50 text-emerald-700"]
          : groomingOutcome(event.pet?.grooming_status || event.booking.status);
        const petName = escapeHistoryHtml(event.pet?.pet_name || "Pet name not recorded");
        const summary = clinic ? event.record.chief_complaint || event.record.diagnosis : historyServices(event.booking, event.pet).join(", ");
        const key = clinic ? event.reference : `${event.booking.booking_id}:${event.pet?.booking_pet_id || ""}`;
        return `
          <article class="portal-card grid grid-cols-1 items-center gap-4 p-4 md:grid-cols-[minmax(0,1fr)_minmax(0,1.15fr)_auto]">
            <div class="flex min-w-0 items-center gap-4">
              <span class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-portal-icon-surface text-portal-primary" aria-hidden="true">
                <svg class="ph-icon h-7 w-7" viewBox="0 0 256 256" focusable="false"><use href="../../assets/icons/phosphor.svg#${historyPetIcon(event.pet)}"></use></svg>
              </span>
              <div class="min-w-0">
                <span class="rounded-full bg-portal-surface-soft px-2 py-1 text-xs font-medium text-portal-muted">${clinic ? "Clinic" : "Grooming"}</span>
                <h3 class="mt-2 break-words text-xl font-bold leading-tight text-portal-text">${petName}</h3>
              </div>
            </div>
            <div class="min-w-0">
              <p class="text-xs font-semibold text-portal-text">${escapeHistoryHtml(healthDate(event.date))}</p>
              ${summary ? `<p class="mt-2 line-clamp-2 break-words text-xs leading-5 text-portal-muted">${escapeHistoryHtml(summary)}</p>` : ""}
            </div>
            <div class="flex shrink-0 items-center gap-2 md:flex-col md:items-end">
              <span class="w-fit rounded-full px-3 py-1 text-xs font-semibold ${outcomeClasses}">${outcomeLabel}</span>
              <button type="button" data-history-open data-history-type="${event.type}" data-history-key="${escapeHistoryHtml(key)}" aria-label="View ${clinic ? "clinic visit" : "grooming session"} details for ${petName}"
                class="flex min-h-10 w-fit items-center gap-2 whitespace-nowrap rounded-xl border border-portal-border bg-white px-3 py-2 text-xs font-semibold text-portal-primary-hover transition hover:bg-portal-surface-soft">
                View details <svg class="ph-icon h-3.5 w-3.5" viewBox="0 0 256 256" aria-hidden="true"><use href="../../assets/icons/phosphor.svg#caret-right"></use></svg>
              </button>
            </div>
          </article>`;
      }

      function buildClinicHistoryDetails(event) {
        return `
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div class="min-w-0">
              <h3 class="break-words text-xl font-bold text-portal-text">${escapeHistoryHtml(event.pet?.pet_name)}</h3>
              <p class="mt-1 break-words text-xs text-portal-muted">${escapeHistoryHtml(event.reference)}</p>
              <p class="mt-2 text-xs text-portal-text">${escapeHistoryHtml(healthDate(event.date))}</p>
            </div>
            <span class="rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700">Completed</span>
          </div>
          <dl class="mt-6 space-y-4">
            ${clinicVisitFields(event.record).map(([label, value]) => `
              <div class="min-w-0 border-t border-portal-border pt-4">
                <dt class="text-xs font-semibold text-portal-muted">${escapeHistoryHtml(label)}</dt>
                <dd class="mt-2 whitespace-pre-line break-words text-sm leading-6 text-portal-text">${escapeHistoryHtml(value)}</dd>
              </div>`).join("")}
          </dl>`;
      }

      const historyModal = document.getElementById("historyModal");
      const historyModalDialog = document.getElementById("historyModalDialog");
      const historyModalContent = document.getElementById("historyModalContent");
      let historyModalTrigger = null;

      function historySizeLabel(size) {
        const normalized = String(size || "").trim().toLowerCase();
        if (!normalized) return "Not recorded";
        return normalized.replaceAll("_", " ").replace(/\b\w/g, (letter) => letter.toUpperCase());
      }

      function buildHistoryModalContent(booking, pet) {
        const [outcomeLabel, outcomeClasses] = groomingOutcome(pet?.grooming_status || booking.status);
        const petName = escapeHistoryHtml(pet?.pet_name || "Pet name not recorded");
        const breed = pet?.breed && pet.breed !== "—" ? escapeHistoryHtml(pet.breed) : "Breed not recorded";
        const species = pet?.species ? escapeHistoryHtml(String(pet.species).replace(/\b\w/g, (letter) => letter.toUpperCase())) : "Species not recorded";
        const groomingTimes = petGroomingTimes(booking, pet);
        const confirmedSize = String(pet?.confirmed_size || "").trim().toLowerCase();
        const sizeValue = historySizeLabel(pet?.confirmed_size || pet?.size);
        const weight = pet?.weight === null || pet?.weight === undefined || pet?.weight === "" || !Number.isFinite(Number(pet.weight))
          ? "Not recorded"
          : `${new Intl.NumberFormat("en-PH", { maximumFractionDigits: 2 }).format(Number(pet.weight))} kg`;
        const services = historyServiceLines(booking, pet);
        const mainServiceIndex = services.some((line) => line.service_kind)
          ? services.findIndex((line) => line.service_kind === "package") : 0;
        const preference = pet?.grooming_preference_label;
        const arrivalWindow = escapeHistoryHtml(booking.time_window?.window_label || "Not recorded");

        return `
          <div class="grid grid-cols-[auto_minmax(0,1fr)] items-center gap-4 sm:flex">
            <span class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-portal-icon-surface text-portal-primary" aria-hidden="true">
              <svg class="ph-icon h-7 w-7" viewBox="0 0 256 256" focusable="false"><use href="../../assets/icons/phosphor.svg#${historyPetIcon(pet)}"></use></svg>
            </span>
            <div class="min-w-0 flex-1">
              <h3 class="break-words text-xl font-bold leading-tight text-portal-text">${petName}</h3>
              <p class="mt-1 break-words text-xs font-medium text-portal-muted">Grooming reference: ${escapeHistoryHtml(booking.booking_reference || "Not recorded")}</p>
            </div>
            <span class="col-span-2 w-fit shrink-0 rounded-full px-3 py-1 text-xs font-semibold ${outcomeClasses}">${outcomeLabel}</span>
          </div>

          <div class="mt-6 grid gap-6 sm:grid-cols-2 sm:gap-8">
            <section class="min-w-0 pl-4">
              <h3 class="flex items-center gap-2 text-base font-bold text-portal-text">
                <svg class="ph-icon h-5 w-5 text-portal-primary" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#calendar-check"></use></svg>
                Visit summary
              </h3>
              <dl class="mt-4 space-y-3">
                <div class="grid grid-cols-[100px_minmax(0,1fr)] gap-3 text-xs"><dt class="font-medium text-portal-muted">Visit day</dt><dd class="font-medium text-portal-text">${escapeHistoryHtml(booking.booking_date || "Not recorded")}</dd></div>
                <div class="grid grid-cols-[100px_minmax(0,1fr)] gap-3 text-xs"><dt class="font-medium text-portal-muted">Entry source</dt><dd class="font-medium text-portal-text">${booking.booking_type === "walk_in" ? "Walk-in" : "Online Registration"}</dd></div>
                <div class="grid grid-cols-[100px_minmax(0,1fr)] gap-3 text-xs"><dt class="font-medium text-portal-muted">Dropped off</dt><dd class="font-medium text-portal-text">${historyDateTime(booking.dropped_off_timestamp)}</dd></div>
                <div class="grid grid-cols-[100px_minmax(0,1fr)] gap-3 text-xs"><dt class="font-medium text-portal-muted">Grooming</dt><dd class="font-medium text-portal-text">${groomingInterval(groomingTimes.start, groomingTimes.finish)}</dd></div>
                ${booking.booking_type !== "walk_in" && booking.time_window?.window_label ? `<div class="grid grid-cols-[100px_minmax(0,1fr)] gap-3 text-xs"><dt class="font-medium text-portal-muted">Arrival window</dt><dd class="font-medium text-portal-text">${arrivalWindow}</dd></div>` : ""}
              </dl>
            </section>

            <section class="min-w-0 sm:border-l sm:border-portal-border sm:pl-8">
              <h3 class="flex items-center gap-2 text-base font-bold text-portal-text">
                <svg class="ph-icon h-5 w-5 text-portal-primary" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#paw-print"></use></svg>
                Pet Information
              </h3>
              <dl class="mt-4 space-y-3">
                <div class="grid grid-cols-[85px_minmax(0,1fr)] gap-3 text-xs"><dt class="font-medium text-portal-muted">Pet Type</dt><dd class="font-medium text-portal-text">${breed} &middot; ${species}</dd></div>
                <div class="grid grid-cols-[85px_minmax(0,1fr)] gap-3 text-xs"><dt class="font-medium text-portal-muted">Pet Groomer</dt><dd class="font-medium text-portal-text">${escapeHistoryHtml(pet?.pet_groomer?.first_name || "Any available groomer")}</dd></div>
                <div class="grid grid-cols-[85px_minmax(0,1fr)] gap-3 text-xs">
                  <dt class="font-medium text-portal-muted">Pet Size</dt>
                  <dd class="font-medium text-portal-text">
                    <span>${escapeHistoryHtml(sizeValue)}</span>
                    ${confirmedSize ? `
                      <span class="ml-1 inline-flex align-middle text-portal-primary" title="Clinic-confirmed pet size">
                        <svg class="ph-icon h-3.5 w-3.5" viewBox="0 0 256 256" aria-label="Clinic-confirmed pet size" focusable="false"><use href="../../assets/icons/phosphor.svg#check-circle"></use></svg>
                      </span>
                      <span class="mt-1 block text-xs text-portal-muted">Clinic-confirmed</span>
                    ` : ""}
                  </dd>
                </div>
                <div class="grid grid-cols-[85px_minmax(0,1fr)] gap-3 text-xs"><dt class="font-medium text-portal-muted">Weight</dt><dd class="font-medium text-portal-text">${escapeHistoryHtml(weight)}</dd></div>
              </dl>
            </section>
          </div>

          <section class="mt-6 rounded-2xl border border-portal-border bg-portal-surface-soft p-4">
            <h3 class="flex items-center gap-2 text-base font-bold text-portal-text">
              <svg class="ph-icon h-5 w-5 text-portal-primary" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg#scissors"></use></svg>
              Services
            </h3>
            ${services.length ? `<ul class="mt-3 space-y-2 text-xs text-portal-text">${services.map((service, index) => `<li class="break-words">${escapeHistoryHtml(service.label)}${index === mainServiceIndex && preference ? `<div class="mt-1"><span class="inline-flex rounded-full bg-portal-active px-2 py-1 text-xs font-medium text-portal-primary">${escapeHistoryHtml(preference)}</span></div>` : ""}</li>`).join("")}</ul>` : '<p class="mt-3 text-xs text-portal-muted">No services recorded.</p>'}
          </section>`;
      }

      function closeHistoryModal() {
        if (historyModal.classList.contains("hidden")) return;
        historyModal.classList.add("hidden");
        historyModal.classList.remove("flex");
        historyModal.setAttribute("aria-hidden", "true");
        document.body.classList.remove("overflow-hidden");
        historyModalTrigger?.focus();
        historyModalTrigger = null;
      }

      function openHistoryModal(event, trigger) {
        historyModalTrigger = trigger;
        document.getElementById("historyModalTitle").textContent = event.type === "clinic" ? "Clinic visit details" : "Grooming session details";
        historyModalContent.innerHTML = event.type === "clinic"
          ? buildClinicHistoryDetails(event) : buildHistoryModalContent(event.booking, event.pet);
        historyModal.classList.remove("hidden");
        historyModal.classList.add("flex");
        historyModal.setAttribute("aria-hidden", "false");
        document.body.classList.add("overflow-hidden");
        historyModalDialog.querySelector("[data-history-modal-close]")?.focus();
      }

      historyList.addEventListener("click", (event) => {
        const trigger = event.target.closest("[data-history-open]");
        if (!trigger) return;
        const entry = allHistory.find((item) => item.type === trigger.dataset.historyType
          && String(item.type === "clinic" ? item.reference : `${item.booking.booking_id}:${item.pet?.booking_pet_id || ""}`) === trigger.dataset.historyKey);
        if (entry) openHistoryModal(entry, trigger);
      });

      historyModal.querySelectorAll("[data-history-modal-close]").forEach((button) =>
        button.addEventListener("click", closeHistoryModal),
      );
      historyModal.querySelector("[data-history-modal-backdrop]")?.addEventListener("click", closeHistoryModal);
      document.addEventListener("keydown", (event) => {
        if (historyModal.classList.contains("hidden")) return;
        if (event.key === "Escape") {
          event.preventDefault();
          closeHistoryModal();
          return;
        }
        if (event.key !== "Tab") return;
        const focusable = Array.from(historyModalDialog.querySelectorAll("button:not([disabled]), a[href], input:not([disabled])"));
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last?.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first?.focus();
        }
      });

      // ── Filter events ─────────────────────────────────────────────────────
      searchInput.addEventListener("input", applyFilters);
      dateFilter.addEventListener("change", applyFilters);
      serviceFilter.addEventListener("change", applyFilters);
      document.getElementById("historyRetry").addEventListener("click", loadHistory);
      clearBtn.addEventListener("click", () => {
        searchInput.value = "";
        dateFilter.value  = "";
        serviceFilter.value = "all";
        applyFilters();
      });

      // ── Boot ──────────────────────────────────────────────────────────────
      void loadHistory();
      window.requestAnimationFrame(() => scheduleCustomerHistoryIdleTask(loadCustomerProfile));
    </script>
    <script src="../../scripts/components/client-notification-ui.js?v=20260915-client-notifications"></script>
    <script type="module" src="../../scripts/components/customer-header-notifications.js?v=customer-cache-20261005-v1"></script>
    <script type="module" src="../../scripts/components/customer-pre-registration-button.js?v=mobile-input-20261028-v2&registration-ui=20261027-v3&auth-feedback=20261028-v3"></script>
  </body>
</html>
