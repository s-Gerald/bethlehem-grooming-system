      <aside
        class="admin-sidebar-menu -translate-x-full fixed inset-y-0 left-0 z-50 flex w-[280px] flex-col border-r border-[#d7e3ef] bg-[#a9bfd6] shadow-xl transition-transform duration-300 lg:translate-x-0" data-session-surface

        <p data-session-public x-cloak x-show="sidebarError" class="admin-load-error px-6" role="alert"><span x-text="sidebarError"></span><button type="button" @click="loadLoggedInIdentity()">Retry</button></p>
        <nav class="px-4 py-6" data-admin-navigation inert>

            <div class="space-y-1.5">
              <a href="./dashboard.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40 text-[#2f4b66]" :class="activePage === 'dashboard' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#squares-four"></use></svg>
                <span>Dashboard</span>
              </a>
              <a href="./clients.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40 text-[#2f4b66]" :class="activePage === 'customers' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#users"></use></svg>
                <span>Customers</span>
              </a>
              <a aria-current="page" data-admin-permission style="display: none" x-show="isAdmin || canAccessGrooming" href="./appointments.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40 bg-[#315b7e] text-white shadow-sm" :class="activePage === 'appointments' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#calendar-dots"></use></svg>
                <span>Grooming</span>
                <span x-show="hasIncomingAppointments" style="display: none" class="ml-auto h-2.5 w-2.5 rounded-full bg-red-500" aria-label="Active grooming customers today"></span>
              </a>
              <a data-admin-permission style="display: none" x-show="isAdmin || clinicPermissions.access" href="./clinic.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40 text-[#2f4b66]" :class="activePage === 'clinic' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#stethoscope"></use></svg>
                <span>Clinic</span>
              </a>
              <a href="./inventory/inventory.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40 text-[#2f4b66]" :class="activePage === 'inventory' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#cube"></use></svg>
                <span>Inventory</span>
              </a>
            </div>
          </div>

          <div class="mb-8">
            <p class="mb-3 px-3 text-xs font-bold text-[#5c7690]">Records</p>
            <div class="space-y-1.5">
              <a href="./archive.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40 text-[#2f4b66]" :class="activePage === 'archive' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#archive"></use></svg>
                <span>History</span>
              </a>
              <a href="./transactions.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40 text-[#2f4b66]" :class="activePage === 'transactions' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#receipt"></use></svg>
                <span>Transactions</span>
              </a>
              <a data-admin-permission href="./reports.html" x-show="isAdmin" style="display: none" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40 text-[#2f4b66]" :class="activePage === 'reports' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#clipboard-text"></use></svg>
                <span>Reports</span>
              </a>
            </div>
          </div>

          <div>
            <p class="mb-3 px-3 text-xs font-bold text-[#5c7690]">System</p>
            <div class="space-y-1.5">
              <a href="./settings.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40 text-[#2f4b66]" :class="activePage === 'settings' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#gear"></use></svg>
                <span>Settings</span>
              </a>
            </div>
          </div>
        </nav>

        <div class="admin-sidebar-footer p-4" data-admin-navigation inert>
          <div data-admin-account aria-busy="true" :aria-busy="String(!sidebarReady)" class="mb-4 flex items-center gap-3 rounded-2xl bg-[#355c84] p-3">
            <div class="flex h-12 w-12 items-center justify-center rounded-full bg-white/20 text-sm font-extrabold text-white" x-text="isAdmin ? 'AD' : staffInitials"></div>
            <div class="min-w-0">
              <p class="truncate font-bold text-white" x-text="isAdmin ? 'Admin' : staffDisplayName"></p>
              <p class="truncate text-sm text-white/80" x-text="isAdmin ? 'Clinic Manager' : staffRoleLabel"></p>
            </div>
          </div>
          <button type="button" class="flex w-full items-center justify-center gap-2 rounded-2xl border border-[#6e8ba8] px-4 py-3 font-bold text-[#1f3850] transition hover:bg-white/30" @click="handleLogout()">
            <svg class="ph-icon h-4 w-4" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#sign-out"></use></svg>
            <span>Logout</span>
          </button>
        </div>
      </aside>
      <script src="../../scripts/api.js?v=admin-navigation-20261018-3&admin-perf=20261019"></script>
      <script src="../../scripts/components/admin-sidebar.js?v=admin-first-paint-20261019&admin-perf=20261019-2&intake=20261019"></script>



      <div class="flex min-h-screen flex-1 flex-col lg:ml-[280px]">
        <header class="sticky top-0 z-30 flex items-center justify-between border-b border-[#d7e3ef] bg-[#f5f8fb]/90 px-4 py-4 backdrop-blur lg:hidden" data-session-surface>
          <div data-session-public>
            <p class="text-sm font-semibold text-[#5c7690]">Admin Panel</p>
            <h2 class="text-lg font-extrabold text-[#1f3850]">Notifications</h2>
          </div>
          <button type="button" class="inline-flex h-11 w-11 items-center justify-center rounded-xl border border-[#c9d9e8] bg-white text-[#315b7e] shadow-sm" @click="sidebarOpen = true">
            <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#list"></use></svg>
          </button>
        </header>

        <main x-data="adminNotifications()" class="flex-1 px-4 py-6 lg:px-6 lg:pt-0">
          <section class="lg:sticky lg:top-0 lg:z-30 lg:-mx-6 lg:bg-[#f5f8fb]/95 lg:px-6 lg:py-4 lg:backdrop-blur" data-session-surface>
            <div class="rounded-[24px] border border-[#cfe0ee] bg-[#a9bfd6] px-4 py-4 lg:px-6" data-session-public>
              <h2 class="text-3xl font-extrabold text-[#1f3850] lg:text-4xl">Notifications</h2>
              <p class="mt-1 text-xs font-medium text-[#355674] lg:text-sm">Bethlehem Animal Clinic &amp; Grooming</p>
            </div>
          </section>

          <section class="mt-6 rounded-[24px] border border-[#d7e3ef] bg-white shadow-sm">
            <div class="flex flex-col gap-3 border-b border-[#e8f0f8] px-4 py-4 sm:flex-row sm:items-center sm:justify-between lg:px-6">
              <div class="flex items-center">
                <button
                  type="button"
                  @click="setStatus('all')"
                  class="border-b-2 px-5 py-2 text-sm font-semibold transition"
                  :class="statusFilter === 'all' ? 'border-[#315b7e] text-[#315b7e]' : 'border-transparent text-slate-400 hover:text-slate-600'"
                >All</button>
                <button
                  type="button"
                  @click="setStatus('unread')"
                  class="border-b-2 px-5 py-2 text-sm font-semibold transition"
                  :class="statusFilter === 'unread' ? 'border-[#315b7e] text-[#315b7e]' : 'border-transparent text-slate-400 hover:text-slate-600'"
                >
                  Unread
                  <span x-show="unreadCount > 0" x-text="'(' + unreadCount + ')'" class="ml-1"></span>
                </button>
              </div>

              <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
                <div
                  class="admin-custom-select w-full sm:w-48"
                  @click.outside="categoryMenuOpen = false"
                  @focusout="if (!$el.contains($event.relatedTarget)) categoryMenuOpen = false"
                  @keydown.escape.stop.prevent="categoryMenuOpen = false; $refs.categoryTrigger.focus()"
                >
                  <button
                    type="button"
                    x-ref="categoryTrigger"
                    class="admin-custom-select-trigger"
                    :disabled="loading"
                    :aria-expanded="String(categoryMenuOpen)"
                    aria-haspopup="listbox"
                    aria-controls="notification-type-options"
                    @click="toggleCategoryMenu()"
                    @keydown.arrow-down.prevent="openCategoryMenu()"
                    @keydown.arrow-up.prevent="openCategoryMenu(true)"
                  >
                    <span class="flex min-w-0 items-center gap-2">
                      <svg class="ph-icon h-4 w-4 shrink-0 text-[#315b7e]" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#funnel"></use></svg>
                      <span class="truncate" x-text="selectedCategoryLabel()"></span>
                    </span>
                    <svg

                      class="ph-icon h-4 w-4 shrink-0 text-[#315b7e] transition-transform"
                      :class="categoryMenuOpen ? 'rotate-180' : ''"
                      aria-hidden="true"
                     viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#caret-down"></use></svg>
                  </button>
                  <div
                    id="notification-type-options"
                    x-ref="categoryListbox"
                    x-show="categoryMenuOpen"
                    x-transition.origin.top.right
                    style="display: none"
                    class="admin-custom-select-options"
                    role="listbox"
                    aria-label="Notification type"
                  >
                    <template x-for="option in categoryOptions" :key="option.value">
                      <button
                        type="button"
                        role="option"
                        class="admin-custom-select-option"
                        :class="categoryFilter === option.value ? 'is-selected' : ''"
                        :aria-selected="String(categoryFilter === option.value)"
                        @click="selectCategory(option.value); $nextTick(() => $refs.categoryTrigger.focus())"
                        @keydown.arrow-down.prevent="moveCategoryFocus($event.currentTarget, 1)"
                        @keydown.arrow-up.prevent="moveCategoryFocus($event.currentTarget, -1)"
                        @keydown.home.prevent="focusCategoryOption()"
                        @keydown.end.prevent="focusCategoryOption(true)"
                      >
                        <span x-text="option.label"></span>
                        <span x-show="categoryFilter === option.value" class="text-[#315b7e]" aria-hidden="true">&#10003;</span>
                      </button>
                    </template>
                  </div>
                </div>
                <button
                  type="button"
                  @click="markAllRead()"
                  :disabled="loading || unreadCount === 0"
                  class="rounded-xl border border-[#c9d9e8] px-4 py-2.5 text-sm font-semibold text-[#315b7e] transition hover:bg-[#eef5fb] disabled:cursor-not-allowed disabled:opacity-50"
                >Mark all as read</button>
              </div>
            </div>

            <p x-cloak x-show="error" class="admin-load-error px-6" role="alert"><span x-text="error"></span><button type="button" @click="loadNotifications(true)">Retry</button></p>

            <admin-loader x-cloak x-show="loading && !loaded"></admin-loader>

            <div x-cloak x-show="loaded" :aria-busy="loading || loadingMore">
              <template x-if="notifications.length === 0">
                <p class="px-6 py-12 text-center text-sm text-slate-400">No notifications found.</p>
              </template>

              <template x-for="group in notificationGroups()" :key="group.dateKey">
                <section>
                  <p class="border-b border-[#f0f4f8] px-6 py-3 text-xs font-bold text-slate-400" x-text="group.label"></p>
                  <template x-for="notification in group.notifications" :key="notification.notification_id">
                    <article
                      @click="markOneRead(notification)"
                      class="flex cursor-pointer items-start gap-4 border-b border-[#f0f4f8] px-6 py-5 transition hover:bg-slate-50"
                      :class="notification.is_read ? 'bg-white' : 'bg-[#eaf4fb]'"
                    >
                      <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[#eef5fb] text-[#315b7e]" aria-hidden="true">
                        <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use :href="'../../assets/icons/phosphor.svg?v=admin-icons-20261018#' + (getAdminNotificationIcon(notification.icon))"></use></svg>
                      </span>
                      <div class="min-w-0 flex-1">
                        <p class="text-sm text-slate-700">
                          <template x-for="(part, partIndex) in notification.message_parts" :key="partIndex">
                            <span :class="part.emphasized ? 'font-semibold' : ''" x-text="part.text"></span>
                          </template>
                        </p>
                        <p x-show="notification.context_parts && notification.context_parts.length" class="mt-1 text-xs text-slate-400">
                          <template x-for="(part, partIndex) in notification.context_parts" :key="partIndex">
                            <span :class="part.emphasized ? 'font-semibold' : ''" x-text="part.text"></span>
                          </template>
                        </p>
                        <p class="mt-1 text-xs text-slate-400" x-text="formatNotificationTime(notification.created_at)"></p>
                      </div>
                      <span class="mt-2 h-2 w-2 shrink-0 rounded-full" :class="notification.is_read ? 'bg-transparent' : 'bg-[#315b7e]'" aria-hidden="true"></span>
                    </article>
                  </template>
                </section>
              </template>
            </div>

            <div x-show="!loading && hasMore" class="px-6 py-5 text-center">
              <button
                type="button"
                @click="loadMore()"
                :disabled="loadingMore"
                class="rounded-xl border border-[#c9d9e8] px-5 py-2.5 text-sm font-semibold text-[#315b7e] transition hover:bg-[#eef5fb] disabled:cursor-wait disabled:opacity-50"
                x-text="loadingMore ? 'Loading...' : 'Load More'"
              ></button>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script src="../../scripts/services/app-clock.js?v=service-prices-20260509"></script>

    <script src="../../scripts/components/admin-notifications.js?v=admin-notification-filter-20260821&loading-ui=universal-20261018&icons=20261018"></script>
  </body>
</html>
