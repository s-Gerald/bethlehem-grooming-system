<!doctype html>
<html data-session-gate="checking" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../../assets/images/clinic/Bethlehem_Logo-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transactions | Bethlehem Animal Clinic</title>
    <link rel="stylesheet" href="../../css/output.css" />
    <link rel="stylesheet" href="../../css/custom.css?v=history-typography-20261003&release=20261001" />
    <link rel="stylesheet" href="../../css/components/admin-transactions.css?v=history-typography-20261003" />
    <link rel="stylesheet" href="../../css/components/print-information.css?v=grooming-invoice-clean-print-20261003" />
    <link rel="stylesheet" href="../../css/session-lock.css?v=20261018" />
    <link rel="stylesheet" href="../../css/admin-loading.css?v=admin-navigation-20261018-2" />
    <script src="../../scripts/components/admin-loading.js?v=universal-20261018"></script>
    <link rel="preload" as="script" href="../../scripts/api.js?v=admin-navigation-20261018-3&admin-perf=20261019" />
    <link rel="preload" as="script" href="../../scripts/components/admin-sidebar.js?v=admin-navigation-20261018-3&admin-perf=20261019-2" />
  </head>
  <body class="bg-[#f5f8fb] text-slate-800">
    <div
      x-data="adminSidebar()"
      class="min-h-screen flex bg-[#f5f8fb]"
     data-admin-shell>
      <!-- Mobile Backdrop -->
      <div
        x-cloak
        x-show="sidebarOpen"
        x-transition.opacity
        class="fixed inset-0 z-40 bg-slate-900/40 lg:hidden"
        @click="sidebarOpen = false"
      ></div>

      <!-- Sidebar -->
      <!-- NOTE: Keep using your already existing sidebar structure/script -->
      <aside
        class="admin-sidebar-menu -translate-x-full fixed inset-y-0 left-0 z-50 flex w-[280px] flex-col border-r border-[#d7e3ef] bg-[#a9bfd6] shadow-xl transition-transform duration-300 lg:translate-x-0"
        :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
       data-session-surface>
        <!-- Brand -->
        <div class="px-6 py-6" data-session-public>
          <div class="flex items-start gap-4">
            <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-white p-1.5 shadow-sm">
              <img
                src="../../assets/images/clinic/Bethlehem_Logo-256.png"
                alt="Bethlehem Animal Clinic logo"
                class="h-full w-full object-contain"
              />
            </div>
            <div class="min-w-0">
              <h1 class="text-xl font-extrabold leading-tight text-[#1f3850]">Bethlehem Animal</h1>
              <p class="text-sm font-medium text-[#355674]">Clinic &amp; Grooming</p>
            </div>
          </div>
        </div>
        <p data-session-public x-cloak x-show="sidebarError" class="admin-load-error px-6" role="alert"><span x-text="sidebarError"></span><button type="button" @click="loadLoggedInIdentity()">Retry</button></p>

        <!-- Navigation -->
        <div data-session-public data-admin-sidebar-loading role="status" aria-label="Loading navigation"><svg class="ph-icon h-5 w-5" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#spinner-gap"></use></svg></div>
        <nav class="px-4 py-6" data-admin-navigation x-show="sidebarReady" x-cloak>
          <div class="mb-8">
            <p class="mb-3 px-3 text-xs font-bold uppercase tracking-[0.18em] text-[#5c7690]">Main</p>
            <div class="space-y-1.5">
              <a href="./dashboard.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'dashboard' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#squares-four"></use></svg>
                <span>Dashboard</span>
              </a>
              <a href="./clients.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'customers' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#users"></use></svg>
                <span>Customers</span>
              </a>
              <a href="./appointments.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'appointments' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#calendar-dots"></use></svg>
                <span>Grooming</span>
                <span x-show="hasIncomingAppointments" style="display: none" class="ml-auto h-2.5 w-2.5 rounded-full bg-red-500" aria-label="Active grooming customers today"></span>
              </a>
              <a href="./clinic.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'clinic' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#stethoscope"></use></svg>
                <span>Clinic</span>
              </a>
              <a href="./inventory/inventory.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'inventory' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#cube"></use></svg>
                <span>Inventory</span>
              </a>
            </div>
          </div>

          <div class="mb-8">
            <p class="mb-3 px-3 text-xs font-bold uppercase tracking-[0.18em] text-[#5c7690]">Records</p>
            <div class="space-y-1.5">
              <a href="./archive.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'archive' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#archive"></use></svg>
                <span>Archive</span>
              </a>
              <a href="./transactions.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'transactions' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#receipt"></use></svg>
                <span>Transactions</span>
              </a>
              <a href="./reports.html" x-show="isAdmin" style="display: none" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'reports' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#clipboard-text"></use></svg>
                <span>Reports</span>
              </a>
            </div>
          </div>

          <div x-show="isAdmin">
            <p class="mb-3 px-3 text-xs font-bold uppercase tracking-[0.18em] text-[#5c7690]">System</p>
            <div class="space-y-1.5">
              <a href="./settings.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'settings' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#gear"></use></svg>
                <span>Settings</span>
              </a>
            </div>
          </div>
        </nav>

        <!-- Admin Info -->
        <div class="admin-sidebar-footer p-4" data-admin-navigation x-show="sidebarReady" x-cloak>
          <div class="mb-4 flex items-center gap-3 rounded-2xl bg-[#355c84] p-3">
            <div class="flex h-12 w-12 items-center justify-center rounded-full bg-white/20 text-sm font-extrabold text-white" x-text="isAdmin ? 'AD' : 'ST'">AD</div>
            <div class="min-w-0">
              <!-- BACKEND: Replace with logged-in admin data -->
              <p class="truncate font-bold text-white" x-text="isAdmin ? 'Admin' : 'Staff'">Admin</p>
              <p class="truncate text-sm text-white/80" x-text="isAdmin ? 'Clinic Manager' : staffRoleLabel">Clinic Manager</p>
            </div>
          </div>
          <!-- Stop Receiving / Reopen toggle — hidden from staff (admin only) -->
          <button
            type="button"
            x-show="isAdmin"
            @click="handleStopReceivingClick()" disabled :disabled="!clinicStatusLoaded"
            class="mb-2 flex w-full items-center justify-center gap-2 rounded-2xl px-4 py-3 font-bold transition"
            :class="clinicStopped ? 'btn-clinic-reopen' : 'btn-clinic-stop'"
          >
            <svg class="ph-icon h-4 w-4 shrink-0" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#door"></use></svg>
            <span x-text="clinicStopped ? 'Reopen Today' : 'We\'re Done for Today'">We're Done for Today</span>
          </button>
          <button type="button" class="flex w-full items-center justify-center gap-2 rounded-2xl border border-[#6e8ba8] px-4 py-3 font-bold text-[#1f3850] transition hover:bg-white/30" @click="handleLogout()">
            <svg class="ph-icon h-4 w-4" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#sign-out"></use></svg>
            <span>Logout</span>
          </button>
        </div>
      </aside>
      <script src="../../scripts/api.js?v=admin-navigation-20261018-3&admin-perf=20261019"></script>
      <script src="../../scripts/components/admin-sidebar.js?v=admin-navigation-20261018-3&admin-perf=20261019-2"></script>

      <!-- Stop Receiving Confirmation Modal -->
      <div x-cloak x-show="stopModal.open" x-transition class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/50 px-4">
        <div class="w-full max-w-sm rounded-3xl bg-white shadow-2xl overflow-hidden">
          <div class="px-6 py-5">
            <h4 class="text-lg font-bold text-slate-800" x-text="stopModal.title"></h4>
            <p class="mt-2 text-sm text-slate-600" x-text="stopModal.message"></p>
            <p x-show="stopModal.error" class="mt-2 text-sm text-red-600" x-text="stopModal.error"></p>
          </div>
          <div class="flex gap-3 px-6 py-4">
            <button type="button" @click="stopModal.open = false" class="flex-1 rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Cancel</button>
            <button type="button" @click="executeStopReceiving()" :disabled="stopModal.busy" class="flex-1 rounded-xl px-4 py-2 text-sm font-semibold transition" :class="clinicStopped ? 'btn-confirm-reopen' : 'btn-confirm-stop'">
              <span x-text="stopModal.busy ? 'Please wait...' : stopModal.confirmLabel"></span>
            </button>
          </div>
        </div>
      </div>
      <!-- Main Content -->
      <div class="flex min-h-screen flex-1 flex-col lg:ml-[280px]">

        <!-- Mobile Header -->
        <header class="sticky top-0 z-30 flex items-center justify-between border-b border-[#d7e3ef] bg-[#f5f8fb]/90 px-4 py-4 backdrop-blur lg:hidden" data-session-surface>
          <div>
            <p class="text-sm font-semibold text-[#5c7690]" data-session-public>Admin Panel</p>
            <h2 class="text-lg font-extrabold text-[#1f3850]" data-session-public>Transactions</h2>
          </div>
          <button type="button" class="inline-flex h-11 w-11 items-center justify-center rounded-xl border border-[#c9d9e8] bg-white text-[#315b7e] shadow-sm" @click="sidebarOpen = true">
            <svg class="ph-icon h-5 w-5" viewBox="0 0 256 256" aria-hidden="true"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#list"></use></svg>
          </button>
        </header>

        <!-- Transactions Content -->
        <main
          x-data="adminTransactions()"
          :aria-busy="loading"
          class="transactions-page flex-1 px-4 py-6 lg:px-6 lg:pt-0"
        >
          <!-- Top Banner -->
          <section class="lg:sticky lg:top-0 lg:z-30 lg:-mx-6 lg:bg-[#f5f8fb]/95 lg:px-6 lg:py-4 lg:backdrop-blur" data-session-surface>
            <div class="rounded-[24px] border border-[#cfe0ee] bg-[#a9bfd6] px-4 py-4 lg:px-6 lg:py-4" data-session-surface>
              <div class="flex flex-col gap-4 xl:flex-row xl:items-center xl:justify-between">
                <div>
                  <h2 class="text-2xl font-extrabold text-[#1f3850] lg:text-3xl" data-session-public>Transactions</h2>
                  <p class="mt-1 text-xs font-medium tracking-[0.18em] text-[#355674] lg:text-sm lg:tracking-[0.25em]" data-session-public>TRANSACTION HISTORY</p>
                </div>

                <!-- Collection summary card -->
                <div class="rounded-xl border border-[#86efac] bg-white/75 px-4 py-2.5 shadow-sm sm:min-w-[220px]">
                  <p class="text-xs font-semibold uppercase tracking-widest text-[#16a34a]" x-text="collectionTitle"></p>
                  <p class="mt-0.5 text-2xl font-bold leading-tight text-[#15803d]" x-text="formatPeso(collectionTotal)" x-cloak x-show="transactionsLoaded"></p>
                  <p class="text-xs text-slate-500" x-cloak x-show="transactionsLoaded" x-text="collectionCount + ' transaction' + (collectionCount !== 1 ? 's' : '')"></p>
                </div>
              </div>

              <!-- Filters -->
              <div class="mt-4 flex flex-wrap items-center gap-3">
                <!-- Search -->
                <label class="transaction-search relative block min-w-0 flex-1 sm:min-w-[280px]">
                  <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                    <svg class="ph-icon h-4 w-4" viewBox="0 0 256 256" aria-hidden="true"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#magnifying-glass"></use></svg>
                  </span>
                  <input
                    type="search"
                    aria-label="Search transactions by reference, customer, pet, or product"
                    x-model="searchQuery"
                    @input.debounce.400ms="onSearchChange()"
                    placeholder="Search by reference, customer, pet, or product..."
                    class="w-full rounded-xl border border-transparent bg-white px-10 py-3 text-sm outline-none placeholder:text-slate-400 focus:border-[#7fa2c9]"
                  />
                </label>

                <label class="flex items-center gap-2 rounded-xl bg-white border border-[#c9d9e8] px-3 py-2.5">
                  <span class="sr-only">Transaction type</span>
                  <select x-model="transactionType" @change="loadTransactions()" class="text-sm font-semibold text-[#1f3850] bg-transparent outline-none cursor-pointer">
                    <option value="all">All Transactions</option><option value="grooming_payment">Grooming Payments</option><option value="clinic_payment">Clinic Payments</option><option value="product_sale">Product Sales</option>
                  </select>
                </label>
                <!-- Period filter -->
                <div class="flex items-center gap-2 rounded-xl bg-white border border-[#c9d9e8] px-3 py-2.5">
                  <svg class="ph-icon h-4 w-4 text-[#315b7e] shrink-0" viewBox="0 0 256 256" aria-hidden="true"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#calendar-check"></use></svg>
                  <select
                    aria-label="Transaction period"
                    x-model="transactionPeriod"
                    @change="onPeriodChange()"
                    class="text-sm font-semibold text-[#1f3850] bg-transparent outline-none cursor-pointer"
                  >
                    <option value="day">Day</option>
                    <option value="month">Month</option>
                    <option value="year">Year</option>
                  </select>
                </div>

                <!-- Period value filter -->
                <div class="flex items-center gap-2 rounded-xl bg-white border border-[#c9d9e8] px-3 py-2.5">
                  <svg class="ph-icon h-4 w-4 text-[#315b7e] shrink-0" viewBox="0 0 256 256" aria-hidden="true"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#calendar-check"></use></svg>
                  <input
                    x-show="transactionPeriod === 'day'"
                    type="date"
                    aria-label="Transaction date"
                    x-model="filterDate"
                    @change="onPeriodValueChange()"
                    class="text-sm font-semibold text-[#1f3850] bg-transparent outline-none cursor-pointer"
                  />
                  <input
                    x-show="transactionPeriod === 'month'"
                    type="month"
                    aria-label="Transaction month"
                    x-model="filterMonth"
                    @change="onPeriodValueChange()"
                    class="text-sm font-semibold text-[#1f3850] bg-transparent outline-none cursor-pointer"
                  />
                  <input
                    x-show="transactionPeriod === 'year'"
                    type="number"
                    min="2000"
                    max="2100"
                    step="1"
                    aria-label="Transaction year"
                    x-model="filterYear"
                    @change="onPeriodValueChange()"
                    class="text-sm font-semibold text-[#1f3850] bg-transparent outline-none cursor-pointer"
                  />
                </div>

                <!-- Clear filters -->
                <template x-if="hasActiveFilters">
                  <button
                    type="button"
                    @click="clearFilters()"
                    class="flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50"
                  >
                    <svg class="ph-icon h-4 w-4" viewBox="0 0 256 256" aria-hidden="true"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#x"></use></svg>
                    Clear Filters
                  </button>
                </template>

                <!-- Total count -->
                <span class="ml-auto rounded-xl bg-white border border-[#c9d9e8] px-4 py-2.5 text-sm font-semibold text-slate-600">
                  <span x-text="totalCount" x-cloak x-show="transactionsLoaded"></span> total
                </span>
              </div>
            </div>
          </section>

          <!-- Loading -->
          <template x-if="loading &amp;&amp; !transactionsLoaded">
            <admin-loader page></admin-loader>
          </template>

          <!-- Error -->
          <template x-if="!loading && errorMessage">
            <div class="mt-6 rounded-2xl border border-red-200 bg-red-50 px-5 py-4 text-sm text-red-700">
              <span x-text="errorMessage"></span>
              <button type="button" @click="loadTransactions(currentPage)" class="ml-2 font-semibold underline">Retry</button>
            </div>
          </template>

          <!-- Empty state -->
          <template x-if="transactionsLoaded && !errorMessage && transactions.length === 0">
            <div class="mt-6 rounded-[24px] border border-dashed border-[#bfd3e3] bg-white p-10 text-center">
              <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-[#dcfce7] text-[#16a34a]">
                <svg class="ph-icon h-8 w-8" viewBox="0 0 256 256" aria-hidden="true"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#clipboard-text"></use></svg>
              </div>
              <p class="mt-4 text-lg font-bold text-[#2f4b66]">No transactions yet</p>
              <p class="mt-2 text-sm text-slate-500">Completed grooming payments, clinic payments, and product sales will appear here.</p>
            </div>
          </template>

          <!-- Transaction groups -->
          <template x-if="transactionsLoaded && transactions.length > 0">
            <div class="mt-6 space-y-8">
              <template x-for="group in groupedTransactions" :key="group.dateKey">
                <div>
                  <!-- Date group header -->
                  <div class="transaction-date-heading mb-3 flex items-center gap-3">
                    <span
                      class="min-w-0 text-sm font-bold uppercase tracking-wide"
                      :class="group.isToday ? 'text-[#16a34a]' : 'text-slate-600'"
                      x-text="group.isToday ? 'Today — ' + group.label : group.label"
                    ></span>
                    <div class="h-px flex-1" :class="group.isToday ? 'bg-[#86efac]' : 'bg-slate-200'"></div>
                    <!-- Daily total -->
                    <span
                      class="shrink-0 rounded-full px-3 py-1 text-xs font-bold"
                      :class="group.isToday ? 'bg-[#dcfce7] text-[#15803d]' : 'bg-slate-100 text-slate-500'"
                      x-text="formatPeso(group.total)"
                    ></span>
                  </div>

                  <!-- Compact history: identify the transaction, then inspect its details. -->
                  <div class="transaction-list">
                    <div class="transaction-columns" aria-hidden="true">
                      <span>Time</span><span>Transaction / Reference</span><span>Details</span><span>Payment</span><span class="transaction-money">Total</span><span></span>
                    </div>
                    <template x-for="tx in group.items" :key="tx.key || tx.id">
                      <article class="transaction-row">
                        <p class="transaction-time" x-text="formatTime(tx.paidAt)"></p>
                        <div class="transaction-owner">
                          <p class="transaction-owner-name" x-text="transactionName(tx)"></p>
                          <p class="transaction-reference" x-text="tx.reference"></p>
                        </div>
                        <p class="transaction-pets" :title="transactionDetails(tx)" x-text="transactionDetails(tx)"></p>
                        <span class="transaction-method" x-text="(tx.paymentMethodLabel || tx.paymentMethod || '—') + (tx.isTest ? ' · Test' : '')"></span>
                        <p class="transaction-total" x-text="formatInvoicePeso(tx.finalPrice)"></p>
                        <button type="button" class="transaction-button transaction-button-secondary transaction-view"
                          :data-transaction-id="tx.key || tx.id" @click="openDetails(tx, $el)" aria-haspopup="dialog" :aria-label="'View Details for ' + tx.reference">View Details</button>
                      </article>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>

<div x-show="!loading && lastPage > 1" class="mt-6 flex flex-wrap items-center justify-between gap-3">
            <p class="text-sm text-slate-500">Page <span x-text="currentPage"></span> of <span x-text="lastPage"></span></p>
            <div class="flex gap-2"><button type="button" class="transaction-button transaction-button-secondary" @click="loadTransactions(currentPage - 1)" :disabled="currentPage <= 1">Previous</button><button type="button" class="transaction-button transaction-button-secondary" @click="loadTransactions(currentPage + 1)" :disabled="currentPage >= lastPage">Next</button></div>
          </div>
          <dialog x-ref="detailsDialog" class="transaction-dialog" aria-labelledby="transaction-details-title"
            @cancel.prevent="closeDetails()" @click="if ($event.target === $el) closeDetails()">
            <template x-if="selectedTransaction">
              <div class="transaction-dialog-layout">
                <header class="transaction-dialog-header">
                  <div class="transaction-dialog-title-row">
                    <h2 id="transaction-details-title" x-text="isClinicPayment(selectedTransaction) ? 'Clinic Payment' : isProductSale(selectedTransaction) ? 'Product Sale' : 'Transaction Details'">Transaction Details</h2>
                    <button type="button" class="transaction-close" aria-label="Close Transaction Details" @click="closeDetails()" autofocus>
                      <svg class="ph-icon" viewBox="0 0 256 256" aria-hidden="true"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#x"></use></svg>
                    </button>
                  </div>
                  <div class="transaction-dialog-subtitle">
                    <span class="transaction-reference" x-text="selectedTransaction.reference"></span>
                    <span x-text="formatTransactionDate(selectedTransaction)"></span>
                    <span class="transaction-method" x-text="(selectedTransaction.paymentMethodLabel || selectedTransaction.paymentMethod || '—') + (selectedTransaction.isTest ? ' · Test' : '')"></span>
                  </div>
                </header>
                <div x-ref="detailsBody" class="transaction-dialog-body" tabindex="0" aria-label="Transaction details content">
                  <section class="transaction-detail-section" aria-labelledby="transaction-information-title">
                    <h3 id="transaction-information-title">Transaction Information</h3>
                    <dl class="transaction-metadata">
                      <template x-if="!isProductSale(selectedTransaction)"><div><dt>Pet Owner</dt><dd x-text="selectedTransaction.ownerName || '—'"></dd></div></template>
                      <template x-if="!isProductSale(selectedTransaction)"><div><dt>Pet</dt><dd x-text="petNames(selectedTransaction).join(', ') || '—'"></dd></div></template>
                      <div><dt x-text="isClinicPayment(selectedTransaction) ? 'Clinic Reference' : 'Reference'">Reference</dt><dd x-text="selectedTransaction.reference"></dd></div>
                      <div><dt>Transaction Date</dt><dd x-text="formatTransactionDate(selectedTransaction)"></dd></div>
                      <div x-show="!isClinicPayment(selectedTransaction)"><dt>Payment Method</dt><dd x-text="(selectedTransaction.paymentMethodLabel || selectedTransaction.paymentMethod || '—') + (selectedTransaction.isTest ? ' · Test' : '')"></dd></div>
                    </dl>
                  </section>
                  <template x-if="!isProductSale(selectedTransaction) && !isClinicPayment(selectedTransaction)">
                  <section class="transaction-detail-section" aria-labelledby="transaction-breakdown-title">
                    <h3 id="transaction-breakdown-title">Payment Breakdown</h3>
                    <h4 class="transaction-category-title">Grooming Services</h4>
                    <template x-for="(pet, petIndex) in selectedTransaction.paymentSummary?.pets || []" :key="pet.booking_pet_id ?? petIndex">
                      <div class="transaction-pet-services">
                        <h5 x-text="pet.pet_name"></h5>
                        <dl class="transaction-line-items">
                          <template x-for="(line, lineIndex) in pet.service_breakdown || []" :key="line.booking_service_id ?? lineIndex">
                            <div><dt x-text="line.label"></dt><dd x-text="formatInvoicePeso(line.price_at_booking)"></dd></div>
                          </template>
                        </dl>
                      </div>
                    </template>
                    <div class="transaction-category-total"><span>Grooming Services</span><strong x-text="formatInvoicePeso(selectedTransaction.groomingServicesTotal)"></strong></div>
                    <template x-if="selectedTransaction.productAddons?.length">
                      <div class="transaction-products">
                        <h4 class="transaction-category-title">Product Add-ons</h4>
                        <dl class="transaction-line-items">
                          <template x-for="(line, index) in selectedTransaction.productAddons" :key="index">
                            <div><dt><span x-text="line.itemName"></span><small x-text="'Qty ' + line.quantity"></small></dt><dd x-text="formatInvoicePeso(line.subtotal)"></dd></div>
                          </template>
                        </dl>
                        <div x-show="selectedTransaction.productAddons.length > 1" class="transaction-category-total"><span>Product Add-ons</span><strong x-text="formatInvoicePeso(selectedTransaction.productAddonsTotal)"></strong></div>
                      </div>
                    </template>
                  </section>
                  </template>
                  <template x-if="isClinicPayment(selectedTransaction)">
                    <section class="transaction-detail-section" aria-labelledby="transaction-clinic-breakdown-title">
                      <h3 id="transaction-clinic-breakdown-title">Payment Breakdown</h3>
                      <dl class="transaction-line-items">
                        <template x-for="charge in selectedTransaction.charges || []" :key="charge.id">
                          <div><dt><span x-text="charge.description"></span><small x-show="Number(charge.quantity) > 1" x-text="'Qty ' + paymentChargeQuantity(charge)"></small></dt><dd x-text="formatInvoicePeso(charge.amount)"></dd></div>
                        </template>
                      </dl>
                    </section>
                  </template>
                  <template x-if="isProductSale(selectedTransaction)">
                    <section class="transaction-detail-section" aria-labelledby="transaction-products-title">
                      <h3 id="transaction-products-title">Products</h3>
                      <dl class="transaction-line-items">
                        <template x-for="line in selectedTransaction.items" :key="line.id">
                          <div><dt><span x-text="line.item_name"></span><small x-text="'Qty ' + Number(line.quantity) + ' × ' + formatInvoicePeso(line.price_at_sale)"></small></dt><dd x-text="formatInvoicePeso(line.subtotal)"></dd></div>
                        </template>
                      </dl>
                    </section>
                  </template>
                  <section class="transaction-detail-section" aria-labelledby="transaction-payment-title">
                    <h3 id="transaction-payment-title">Payment Details</h3>
                    <dl class="transaction-line-items transaction-payment">
                      <div><dt>Payment Method</dt><dd x-text="(selectedTransaction.paymentMethodLabel || selectedTransaction.paymentMethod || '—') + (selectedTransaction.isTest ? ' · Test' : '')"></dd></div>
                      <div><dt>Amount Due</dt><dd x-text="formatInvoicePeso(selectedTransaction.finalPrice)"></dd></div>
                      <div x-show="selectedTransaction.paymentMethod === 'cash'"><dt>Cash Received</dt><dd x-text="isClinicPayment(selectedTransaction) && selectedTransaction.amountPaid == null ? '—' : formatInvoicePeso(selectedTransaction.amountPaid)"></dd></div>
                      <div x-show="selectedTransaction.paymentMethod === 'cash'"><dt>Change</dt><dd x-text="isClinicPayment(selectedTransaction) && selectedTransaction.changeGiven == null ? '—' : formatInvoicePeso(selectedTransaction.changeGiven)"></dd></div>
                      <div x-show="selectedTransaction.paymentMethod === 'online' && selectedTransaction.providerMethod"><dt>Provider Method</dt><dd x-text="selectedTransaction.providerMethod"></dd></div>
                      <div x-show="isClinicPayment(selectedTransaction) || selectedTransaction.processedByName"><dt>Processed By</dt><dd x-text="selectedTransaction.processedByName || '—'"></dd></div>
                      <div><dt>Paid At</dt><dd x-text="formatTransactionDate(selectedTransaction)"></dd></div>
                    </dl>
                    <div class="transaction-paid-total"><span>Total Paid</span><strong x-text="formatInvoicePeso(selectedTransaction.finalPrice)"></strong></div>
                    <p x-show="selectedTransaction.reconciliationReason" x-text="selectedTransaction.reconciliationReason === 'product_stock_conflict' ? 'Payment received. Product stock needs reconciliation. Contact an administrator.' : 'Payment received for an already-paid visit. Contact an administrator.'" class="text-sm text-red-600" role="status"></p>
                    <div x-show="selectedTransaction.notes" class="transaction-notes"><h4>Notes</h4><p x-text="selectedTransaction.notes"></p></div>
                  </section>
                </div>
                <template x-if="!isProductSale(selectedTransaction) && !isClinicPayment(selectedTransaction)"><div class="receipt-print-source" aria-hidden="true" x-html="window.PaymentInvoice.template"></div></template>
                <template x-if="isClinicPayment(selectedTransaction)"><div class="receipt-print-source" aria-hidden="true" x-html="window.PaymentInvoice.clinicTemplate"></div></template>
                <template x-if="isProductSale(selectedTransaction)"><div class="receipt-print-source" aria-hidden="true" x-data="{ receipt: selectedTransaction.receipt }" x-html="window.ProductSaleInvoice.template"></div></template>
                <footer class="transaction-dialog-footer">
                  <button type="button" class="transaction-button transaction-button-secondary" @click="closeDetails()">Close</button>
                  <button type="button" class="transaction-button transaction-button-primary" @click="printInvoice()">
                    <svg class="ph-icon" viewBox="0 0 256 256" aria-hidden="true"><path d="M64 80V40h128v40M64 176H40a16 16 0 0 1-16-16v-64a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16v64a16 16 0 0 1-16 16h-24M64 144h128v72H64Z" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><circle cx="188" cy="112" r="12" fill="currentColor"/></svg>
                    Print Invoice
                  </button>
                </footer>
              </div>
            </template>
          </dialog>

        </main>
      </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>


    <script src="../../scripts/components/payment-invoice.js?v=clinic-payments-20261015&release=pos-20261007&copy=grooming-terminology-20261016&payments=20261018-shared"></script>
    <script src="../../scripts/components/product-sale-invoice.js?v=pos-20261007&payments=20261018-shared"></script>
    <script src="../../scripts/components/admin-transactions.js?v=clinic-payments-20261015&payments=20261018-shared&loading-ui=universal-20261018&icons=20261018"></script>
  </body>
</html>
