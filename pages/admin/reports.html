<!doctype html>
<html data-session-gate="checking" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../../assets/images/clinic/Bethlehem_Logo-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports | Bethlehem Animal Clinic</title>
    <link rel="stylesheet" href="../../css/output.css" />
    <link rel="stylesheet" href="../../css/custom.css?v=unified-inventory-20261001b&release=20261001" />
    <link rel="stylesheet" href="../../css/session-lock.css?v=20261018" />
    <link rel="stylesheet" href="../../css/admin-reports.css?v=clinic-reports-20261018" />
    <link rel="stylesheet" href="../../css/admin-loading.css?v=universal-20261018" />
    <script src="../../scripts/components/admin-loading.js?v=universal-20261018"></script>
  </head>
  <body class="bg-[#f5f8fb] text-slate-800">
    <div
      x-data="adminSidebar()"
      class="min-h-screen flex bg-[#f5f8fb]"
     data-admin-shell>
      <div
        x-cloak
        x-show="sidebarOpen"
        x-transition.opacity
        class="fixed inset-0 z-40 bg-slate-900/40 lg:hidden"
        @click="sidebarOpen = false"
      ></div>

      <aside
        class="admin-sidebar-menu -translate-x-full fixed inset-y-0 left-0 z-50 flex w-[280px] flex-col border-r border-[#d7e3ef] bg-[#a9bfd6] shadow-xl transition-transform duration-300 lg:translate-x-0"
        :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
       data-session-surface>
        <div class="px-6 py-6" data-session-public>
          <div class="flex items-start gap-4">
            <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-white p-1.5 shadow-sm">
              <img
                src="../../assets/images/clinic/Bethlehem_Logo-256.png"
                alt="Bethlehem Animal Clinic logo"
                class="h-full w-full object-contain"
              />
            </div>
            <div class="min-w-0">
              <h1 class="text-xl font-extrabold leading-tight text-[#1f3850]">Bethlehem Animal</h1>
              <p class="text-sm font-medium text-[#355674]">Clinic &amp; Grooming</p>
            </div>
          </div>
        </div>
        <p data-session-public x-cloak x-show="sidebarError" class="admin-load-error px-6" role="alert"><span x-text="sidebarError"></span><button type="button" @click="loadLoggedInIdentity()">Retry</button></p>

        <nav class="px-4 py-6" data-admin-navigation x-show="sidebarReady" x-cloak>
          <div class="mb-8">
            <p class="mb-3 px-3 text-xs font-bold uppercase tracking-[0.18em] text-[#5c7690]">Main</p>
            <div class="space-y-1.5">
              <a href="./dashboard.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'dashboard' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="layout-dashboard" class="h-5 w-5"></i>
                <span>Dashboard</span>
              </a>
              <a href="./clients.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'customers' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="users" class="h-5 w-5"></i>
                <span>Customers</span>
              </a>
              <a href="./appointments.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'appointments' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="calendar-days" class="h-5 w-5"></i>
                <span>Grooming</span>
                <span x-show="hasIncomingAppointments" style="display: none" class="ml-auto h-2.5 w-2.5 rounded-full bg-red-500" aria-label="Active grooming customers today"></span>
              </a>
              <a href="./clinic.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'clinic' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="stethoscope" class="h-5 w-5"></i>
                <span>Clinic</span>
              </a>
              <a href="./inventory/inventory.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'inventory' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="box" class="h-5 w-5"></i>
                <span>Inventory</span>
              </a>
            </div>
          </div>

          <div class="mb-8">
            <p class="mb-3 px-3 text-xs font-bold uppercase tracking-[0.18em] text-[#5c7690]">Records</p>
            <div class="space-y-1.5">
              <a href="./archive.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'archive' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="archive" class="h-5 w-5"></i>
                <span>Archive</span>
              </a>
              <a href="./transactions.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'transactions' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="receipt" class="h-5 w-5"></i>
                <span>Transactions</span>
              </a>
              <a href="./reports.html" x-show="isAdmin" style="display: none" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'reports' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="clipboard-list" class="h-5 w-5"></i>
                <span>Reports</span>
              </a>
            </div>
          </div>

          <div x-show="isAdmin">
            <p class="mb-3 px-3 text-xs font-bold uppercase tracking-[0.18em] text-[#5c7690]">System</p>
            <div class="space-y-1.5">
              <a href="./settings.html" class="flex items-center gap-3 rounded-2xl px-4 py-3 font-semibold transition hover:bg-white/40" :class="activePage === 'settings' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-[#2f4b66]'">
                <i data-lucide="settings" class="h-5 w-5"></i>
                <span>Settings</span>
              </a>
            </div>
          </div>
        </nav>

        <div class="admin-sidebar-footer p-4" data-admin-navigation x-show="sidebarReady" x-cloak>
          <div class="mb-4 flex items-center gap-3 rounded-2xl bg-[#355c84] p-3">
            <div class="flex h-12 w-12 items-center justify-center rounded-full bg-white/20 text-sm font-extrabold text-white" x-text="isAdmin ? 'AD' : 'ST'">AD</div>
            <div class="min-w-0">
              <p class="truncate font-bold text-white" x-text="isAdmin ? 'Admin' : 'Staff'">Admin</p>
              <p class="truncate text-sm text-white/80" x-text="isAdmin ? 'Clinic Manager' : staffRoleLabel">Clinic Manager</p>
            </div>
          </div>

          <button
            type="button"
            x-show="isAdmin"
            @click="handleStopReceivingClick()"
            class="mb-2 flex w-full items-center justify-center gap-2 rounded-2xl px-4 py-3 font-bold transition"
            :class="clinicStopped ? 'btn-clinic-reopen' : 'btn-clinic-stop'"
          >
            <i data-lucide="door-closed" class="h-4 w-4 shrink-0"></i>
            <span x-text="clinicStopped ? 'Reopen Today' : 'We\'re Done for Today'"></span>
          </button>

          <button type="button" class="flex w-full items-center justify-center gap-2 rounded-2xl border border-[#6e8ba8] px-4 py-3 font-bold text-[#1f3850] transition hover:bg-white/30" @click="handleLogout()">
            <i data-lucide="log-out" class="h-4 w-4"></i>
            <span>Logout</span>
          </button>
        </div>
      </aside>

      <div
        x-cloak
        x-show="stopModal.open"
        x-transition
        class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/50 px-4"
      >
        <div class="w-full max-w-sm rounded-3xl bg-white shadow-2xl overflow-hidden">
          <div class="px-6 py-5">
            <h4 class="text-lg font-bold text-slate-800" x-text="stopModal.title"></h4>
            <p class="mt-2 text-sm text-slate-600" x-text="stopModal.message"></p>
            <p x-show="stopModal.error" class="mt-2 text-sm text-red-600" x-text="stopModal.error"></p>
          </div>
          <div class="flex gap-3 px-6 py-4">
            <button type="button" @click="stopModal.open = false" class="flex-1 rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Cancel</button>
            <button type="button" @click="executeStopReceiving()" :disabled="stopModal.busy" class="flex-1 rounded-xl px-4 py-2 text-sm font-semibold transition" :class="clinicStopped ? 'btn-confirm-reopen' : 'btn-confirm-stop'">
              <span x-text="stopModal.busy ? 'Please wait...' : stopModal.confirmLabel"></span>
            </button>
          </div>
        </div>
      </div>

      <div class="flex min-h-screen min-w-0 flex-1 flex-col lg:ml-[280px]">
        <header
          class="reports-mobile-header sticky top-0 z-30 flex items-center justify-between border-b border-[#d7e3ef] bg-[#f5f8fb]/90 px-4 py-4 backdrop-blur lg:hidden"
         data-session-surface>
          <div>
            <p class="text-sm font-semibold text-[#5c7690]" data-session-public>Admin Panel</p>
            <h2 class="text-lg font-extrabold text-[#1f3850]" data-session-public>Reports</h2>
          </div>

          <button
            type="button"
            class="inline-flex h-11 w-11 items-center justify-center rounded-xl border border-[#c9d9e8] bg-white text-[#315b7e] shadow-sm"
            aria-label="Open navigation" @click="sidebarOpen = true"
          >
            <i data-lucide="menu" class="h-5 w-5"></i>
          </button>
        </header>

        <main x-data="adminReports()" class="reports-page flex-1 px-4 py-6 lg:px-6" aria-label="Reports">
          <header class="reports-heading" data-session-surface>
            <h1 data-session-public>Reports</h1>
          </header>
          <div class="reports-tabs" role="tablist" aria-label="Report sections"
            @keydown.right.prevent="selectSection(activeSection === 'grooming' ? 'clinic' : 'grooming'); $nextTick(() => $refs[activeSection + 'Tab'].focus())"
            @keydown.left.prevent="selectSection(activeSection === 'grooming' ? 'clinic' : 'grooming'); $nextTick(() => $refs[activeSection + 'Tab'].focus())"
            @keydown.home.prevent="selectSection('grooming'); $refs.groomingTab.focus()"
            @keydown.end.prevent="selectSection('clinic'); $refs.clinicTab.focus()">
            <button type="button" id="grooming-tab" x-ref="groomingTab" role="tab" aria-controls="reports-panel" :aria-selected="activeSection === 'grooming'" :tabindex="activeSection === 'grooming' ? 0 : -1" @click="selectSection('grooming')">Grooming</button>
            <button type="button" id="clinic-tab" x-ref="clinicTab" role="tab" aria-controls="reports-panel" :aria-selected="activeSection === 'clinic'" :tabindex="activeSection === 'clinic' ? 0 : -1" @click="selectSection('clinic')">Clinic</button>
          </div>

          <section id="reports-panel" role="tabpanel" :aria-labelledby="activeSection + '-tab'" :aria-busy="loading">
            <div class="reports-toolbar">
              <h2 x-text="sectionLabel + ' Performance'">Grooming Performance</h2>
              <form class="reports-filters" @submit.prevent="loadReport()">
                <div class="reports-field">
                  <label for="report-period">Reporting period</label>
                  <select id="report-period" x-model="period" @change="changePeriod()">
                    <option value="today">Today</option>
                    <option value="last_7_days">Last 7 Days</option>
                    <option value="this_month">This Month</option>
                    <option value="last_month">Last Month</option>
                    <option value="custom">Custom Range</option>
                  </select>
                </div>
                <template x-if="period === 'custom'">
                  <div class="reports-custom-dates">
                    <div class="reports-field"><label for="report-start">Start date</label><input id="report-start" type="date" x-model="start" :max="end || null" required :aria-invalid="!!validationError" aria-describedby="report-validation" /></div>
                    <div class="reports-field"><label for="report-end">End date</label><input id="report-end" type="date" x-model="end" :min="start || null" required :aria-invalid="!!validationError" aria-describedby="report-validation" /></div>
                    <button type="submit" class="reports-button reports-primary" :disabled="loading">Apply</button>
                  </div>
                </template>
                <button x-show="period !== 'custom'" type="submit" class="reports-button reports-refresh" :disabled="loading" aria-label="Refresh report" title="Refresh report"><i data-lucide="refresh-cw" aria-hidden="true"></i></button>
              </form>
            </div>
            <p id="report-validation" class="reports-validation" x-show="validationError" x-text="validationError" role="alert" x-cloak></p>
            <div x-show="error" class="reports-error" role="alert" x-cloak>
              <p x-text="error"></p>
              <button type="button" class="reports-button" @click="loadReport()">Retry</button>
            </div>
            <admin-loader x-cloak page x-show="loading &amp;&amp; !report"></admin-loader>

            <template x-if="report">
              <div class="reports-content">
                <p class="reports-period-label" x-text="periodLabel"></p>
                <div class="reports-kpis" :class="{ 'reports-kpis-clinic': activeSection === 'clinic' }" aria-label="Business overview">
                  <template x-for="kpi in kpis" :key="kpi.title">
                    <article class="reports-card reports-kpi" :title="kpi.hint || null">
                      <div class="reports-kpi-heading"><h3 x-text="kpi.title"></h3><i :data-lucide="kpi.icon" aria-hidden="true"></i></div>
                      <p x-text="kpi.value"></p>
                    </article>
                  </template>
                </div>

                <article class="reports-card reports-performance" aria-labelledby="performance-title">
                  <div class="reports-card-heading">
                    <h3 id="performance-title">Performance Over Time</h3>
                    <div class="reports-segmented" role="group" aria-label="Performance metric">
                      <button type="button" :aria-pressed="metric === 'collections'" @click="metric = 'collections'; activePoint = null">Collections</button>
                      <button type="button" :aria-pressed="metric === 'visits'" @click="metric = 'visits'; activePoint = null">Visits</button>
                    </div>
                  </div>
                  <template x-if="!hasPerformance"><p class="reports-empty" x-text="metric === 'collections' ? 'No collections for this period.' : 'No completed visits for this period.'"></p></template>
                  <div x-show="hasPerformance" class="reports-chart">
                    <p class="reports-chart-tooltip" aria-live="polite" x-text="activePoint !== null && chartPoints[activePoint] ? pointDescription(chartPoints[activePoint]) : (metric === 'collections' ? 'Collections (PHP)' : 'Completed visits')"></p>
                    <svg :viewBox="`0 0 ${chartWidth} 250`" x-init="observeChart($el)" role="group" :aria-label="metric === 'collections' ? sectionLabel + ' collections over time' : 'Completed ' + sectionLabel.toLowerCase() + ' visits over time'"
                      x-html="chartMarkup" @pointerover="inspectPoint($event)" @pointerleave="activePoint = null" @focusin="inspectPoint($event)" @focusout="activePoint = null" @click="inspectPoint($event)" @keydown.enter.prevent="inspectPoint($event)" @keydown.space.prevent="inspectPoint($event)"></svg>
                    <details class="reports-data-details"><summary>View chart data</summary><div class="reports-table-wrap"><table><caption class="reports-sr-only">Performance Over Time</caption><thead><tr><th scope="col">Period</th><th scope="col">Collections</th><th scope="col">Visits</th></tr></thead><tbody><template x-for="point in chartPoints" :key="point.date"><tr><th scope="row" x-text="point.label"></th><td x-text="formatMoney(point.collections)"></td><td x-text="formatCount(point.visits)"></td></tr></template></tbody></table></div></details>
                  </div>
                </article>

                <article class="reports-card" aria-labelledby="services-title">
                  <div class="reports-card-heading"><h3 id="services-title" x-text="'Popular ' + sectionLabel + ' Services'">Popular Grooming Services</h3></div>
                  <p class="reports-empty" x-show="report.services.length === 0">No completed services for this period.</p>
                  <ol class="reports-services" x-show="report.services.length > 0" aria-label="Completed services, most performed first">
                    <template x-for="(service, index) in visibleServices" :key="index">
                      <li><div class="reports-service-heading"><div><span class="reports-service-name" x-text="service.name"></span><span class="reports-service-kind" x-show="activeSection === 'grooming'" x-text="serviceKind(service.kind)"></span></div><strong x-text="formatCount(service.count)" :aria-label="`${formatCount(service.count)} completed`"></strong></div><div class="reports-service-track" aria-hidden="true"><div :style="{ width: serviceWidth(service.count) }"></div></div></li>
                    </template>
                  </ol>
                  <button type="button" class="reports-more" x-show="report.services.length > 6" @click="showAllServices = !showAllServices" :aria-expanded="showAllServices" x-text="showAllServices ? 'Show fewer' : `Show all ${formatCount(report.services.length)} services`"></button>
                </article>

                <article class="reports-card" aria-labelledby="insights-title">
                  <div class="reports-card-heading"><h3 id="insights-title" x-text="activeSection === 'clinic' ? 'Clinic Visit Outcomes' : 'Customer Insights'">Customer Insights</h3></div>
                  <div class="reports-insights" :class="{ 'reports-insights-clinic': activeSection === 'clinic' }">
                    <template x-if="activeSection === 'grooming'"><div>
                      <p class="reports-empty reports-empty-compact" x-show="customerTotal === 0">No completed customer visits for this period.</p>
                      <div x-show="customerTotal > 0">
                        <dl class="reports-customer-counts"><div><dt><span class="reports-customer-dot reports-new"></span>New customers</dt><dd x-text="formatCount(report.customers.new)"></dd></div><div><dt><span class="reports-customer-dot reports-returning"></span>Returning customers</dt><dd x-text="formatCount(report.customers.returning)"></dd></div></dl>
                        <div class="reports-customer-share" aria-hidden="true"><div :style="{ width: newCustomerWidth }"></div></div>
                      </div>
                    </div></template>
                    <div class="reports-outcomes"><h4 x-show="activeSection === 'grooming'">Visit outcomes</h4><dl><div><dt>Completed</dt><dd x-text="formatCount(report.outcomes.completed)"></dd></div><div><dt>Cancelled</dt><dd x-text="formatCount(report.outcomes.cancelled)"></dd></div><div><dt>No-show</dt><dd x-text="formatCount(report.outcomes.noShow)"></dd></div></dl></div>
                  </div>
                </article>
              </div>
            </template>
          </section>
        </main>
      </div>
    </div>

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../../scripts/api.js?v=clinic-reports-20261018&release=20261001&auth=session-scope-20261006&clinic=roles-20261010&payments=20261018-shared&session=lock-20261018&loading-ui=universal-20261018"></script>
    <script src="../../scripts/components/admin-sidebar.js?v=grooming-today-indicator-20261005&release=inventory-labels-20261007&clinic=roles-20261010&clinic-services=20261013&services=20261017&loading-ui=universal-20261018"></script>
    <script src="../../scripts/components/admin-reports.js?v=clinic-reports-20261018&loading-ui=universal-20261018"></script>
  </body>
</html>
