<!doctype html>
<html data-session-gate="checking" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../../assets/images/clinic/Bethlehem_Logo-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Walk-in - Pet Information</title>
    <link rel="stylesheet" href="../../css/output.css?consent=20261017&services=20261026" />
    <link rel="stylesheet" href="../../css/custom.css?v=site-assets-20261001&release=20261001&pet-fields=20261026-v1&grooming=actual-20261026" />

    <link rel="stylesheet" href="../../css/grooming-preferences.css?v=20261009&services=20261026&grooming=actual-20261026">
    <link rel="stylesheet" href="../../css/session-lock.css?v=20261018&session-presentation=walk-in-20261021" />
  </head>

  <body class="min-h-screen bg-[#f6fafd] text-slate-800">
    <main class="mx-auto max-w-6xl px-4 py-8 md:px-6 lg:px-8">
      <section data-session-public class="mb-6">
        <a
          id="ownerBackLink"
          href="./dashboard.html"
          class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-slate-700"
        >
          &larr; Back to Home
        </a>

        <div class="mt-4">
          <h1 class="text-3xl font-bold text-[#2f4b66]">
            Enter your Pet Information
          </h1>
        </div>

        <div class="mt-6">
          <div
            class="mb-2 flex items-center justify-between text-xs font-medium text-slate-500"
          >
            <span>Step 2 of 5</span>
            <span>40% Complete</span>
          </div>
          <div class="h-2 w-full rounded-full bg-slate-200">
            <div
              class="h-2 rounded-full bg-[#315b7e]"
              style="width: 40%"
            ></div>
          </div>
        </div>
      </section>

      <section data-session-surface class="rounded-3xl bg-[#cfe3f6] p-6 shadow-lg md:p-8">
        <div class="mx-auto max-w-5xl">
          <div class="mb-6">
            <h2 class="text-3xl font-bold text-[#2f4b66]">Pet Information</h2>
            <p id="petSelectionLimitText" class="mt-1 text-xs text-slate-500">
              Maximum of 10 pets per walk-in schedule.
            </p>
          </div>

          <div id="petSelectionTabs" class="mb-6 flex flex-col gap-3 sm:flex-row">
            <button id="showExistingPetBtn" type="button" aria-controls="existingPetsSection" aria-pressed="false"
              class="rounded-2xl border border-[#315b7e] bg-white px-5 py-3 text-sm font-semibold text-[#315b7e] transition hover:bg-[#edf5fc]">
              Select Existing Pet
            </button>
            <button id="showAddPetBtn" type="button" aria-controls="addPetSection" aria-pressed="false"
              class="rounded-2xl border border-[#315b7e] bg-white px-5 py-3 text-sm font-semibold text-[#315b7e] transition hover:bg-[#edf5fc]">
              Add New Pet
            </button>
          </div>

          <section id="existingPetsSection" class="mb-6 hidden rounded-2xl border border-[#b9d1e7] bg-white/85 p-5 shadow-sm">
            <div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
              <div>
                <h3 class="text-lg font-semibold text-[#2f4b66]">Your Saved Pets</h3>
                <p id="existingPetsOwnerText" class="mt-1 text-sm text-slate-500"></p>
              </div>
              <span id="existingPetsCount" class="self-start rounded-full bg-[#edf5fc] px-3 py-1 text-xs font-medium text-[#315b7e]"></span>
            </div>
            <div id="existingPetsLoading" class="mt-4 hidden py-8 text-center" role="status" aria-live="polite">
              <svg class="mx-auto h-8 w-8 animate-spin fill-current text-[#315b7e]" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#spinner-gap"></use></svg>
              <p class="mt-2 text-sm text-slate-500">Loading saved pets...</p>
            </div>
            <div id="existingPetCards" class="mt-4 grid gap-3 md:grid-cols-2"></div>
          </section>

          <p
            id="petStepError"
            class="mb-6 hidden rounded-2xl border border-red-200 bg-red-50 p-5 text-sm text-red-700"
            role="alert"
          ></p>

          <section
            id="addPetSection"
            class="hidden rounded-2xl bg-white/85 p-5 shadow-sm"
          >
            <div class="mb-4">
              <h3 class="text-lg font-bold text-[#2f4b66]">Add Pet</h3>
            </div>

            <!--
              BACKEND TEAMMATE + CLAUDE CODE:
              Added pets live only in the frontend walk-in draft right now.
              Persist these fields as draft pet records before final booking
              submission once the database flow is connected.
            -->
            <form id="addPetForm" class="space-y-5" novalidate>
              <div class="grid gap-5 md:grid-cols-2">
                <div>
                  <label
                    for="petType"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Pet Type <span class="text-red-500">*</span>
                  </label>
                  <div id="petTypeCombobox" class="relative">
                    <div class="relative">
                      <input
                        id="petType"
                        name="petType"
                        type="text"
                        placeholder="Select pet type"
                        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 pr-12 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20 read-only:cursor-pointer"
                        role="combobox"
                        aria-autocomplete="none"
                        aria-controls="petTypeOptions"
                        aria-expanded="false"
                        aria-invalid="false"
                        autocomplete="off"
                        readonly
                        required
                        aria-required="true"
                      />
                      <button
                        id="petTypeDropdownButton"
                        type="button"
                        class="absolute inset-y-0 right-0 flex w-12 items-center justify-center rounded-r-xl text-slate-500 transition hover:text-[#315b7e] focus:outline-none focus:ring-2 focus:ring-inset focus:ring-[#315b7e]/20"
                        aria-label="Show pet type options"
                        aria-controls="petTypeOptions"
                        aria-expanded="false"
                      >
                        <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#caret-down"></use></svg>
                      </button>
                    </div>
                    <div
                      id="petTypeOptions"
                      class="absolute z-30 mt-1 hidden max-h-64 w-full overflow-y-auto rounded-xl border border-slate-200 bg-white py-1 shadow-lg"
                      role="listbox"
                      aria-label="Pet type options"
                    ></div>
                  </div>
                  <p id="petTypeError" class="mt-2 hidden text-sm text-red-600"></p>
                </div>

                <div>
                  <label
                    for="petName"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Pet Name <span class="text-red-500">*</span>
                  </label>
                  <input
                    id="petName"
                    name="petName"
                    type="text"
                    maxlength="100"
                    placeholder="Enter pet name"
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20"
                    required
                    aria-required="true"
                  />
                  <p id="petNameError" class="mt-2 hidden text-sm text-red-600"></p>
                </div>

                <div>
                  <label
                    for="breed"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Breed <span data-breed-requirement class="text-slate-400 font-normal">(optional)</span>
                  </label>
                  <div id="breedCombobox" class="relative">
                    <div class="relative">
                      <input
                        id="breed"
                        name="breed"
                        type="text"
                        maxlength="100"
                        placeholder="Select pet type first"
                        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 pr-12 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20 read-only:cursor-pointer disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-400"
                        role="combobox"
                        aria-autocomplete="list"
                        aria-controls="breedOptions"
                        aria-expanded="false"
                        aria-invalid="false"
                        autocomplete="off"
                        readonly
                        disabled
                      />
                      <button
                        id="breedDropdownButton"
                        type="button"
                        class="absolute inset-y-0 right-0 flex w-12 items-center justify-center rounded-r-xl text-slate-500 transition hover:text-[#315b7e] focus:outline-none focus:ring-2 focus:ring-inset focus:ring-[#315b7e]/20 disabled:cursor-not-allowed disabled:text-slate-300"
                        aria-label="Show breed options"
                        aria-controls="breedOptions"
                        aria-expanded="false"
                        disabled
                      >
                        <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#caret-down"></use></svg>
                      </button>
                    </div>
                    <div
                      id="breedOptions"
                      class="absolute z-30 mt-1 hidden max-h-64 w-full overflow-y-auto rounded-xl border border-slate-200 bg-white py-1 shadow-lg"
                      role="listbox"
                      aria-label="Breed options"
                    ></div>
                  </div>
                  <p id="breedError" role="alert" class="mt-2 hidden text-sm text-red-600"></p>
                </div>

                <div>
                  <label
                    for="furType"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Fur Type <span data-fur-requirement class="text-slate-400 font-normal">(optional)</span>
                  </label>
                  <div id="furTypeCombobox" class="relative">
                    <div class="relative">
                      <input
                        id="furType"
                        name="furType"
                        type="text"
                        placeholder="Select breed first"
                        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 pr-12 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20 read-only:cursor-pointer disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-400"
                        role="combobox"
                        aria-autocomplete="none"
                        aria-controls="furTypeOptions"
                        aria-expanded="false"
                        aria-invalid="false"
                        autocomplete="off"
                        readonly
                        disabled
                      />
                      <button
                        id="furTypeDropdownButton"
                        type="button"
                        class="absolute inset-y-0 right-0 flex w-12 items-center justify-center rounded-r-xl text-slate-500 transition hover:text-[#315b7e] focus:outline-none focus:ring-2 focus:ring-inset focus:ring-[#315b7e]/20 disabled:cursor-not-allowed disabled:text-slate-300"
                        aria-label="Show fur type options"
                        aria-controls="furTypeOptions"
                        aria-expanded="false"
                        disabled
                      >
                        <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#caret-down"></use></svg>
                      </button>
                    </div>
                    <div
                      id="furTypeOptions"
                      class="absolute z-30 mt-1 hidden max-h-64 w-full overflow-y-auto rounded-xl border border-slate-200 bg-white py-1 shadow-lg"
                      role="listbox"
                      aria-label="Fur type options"
                    ></div>
                  </div>
                  <p id="furTypeError" role="alert" class="mt-2 hidden text-sm text-red-600"></p>
                </div>

                <div>
                  <label
                    for="weight"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Weight <span class="text-slate-400 font-normal">(optional)</span>
                  </label>
                  <div class="relative">
                    <input
                    id="weight"
                    name="weight"
                    type="text"
                    inputmode="decimal"
                    placeholder="e.g. 4.25"
                    aria-invalid="false" aria-describedby="weightError"
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 pr-12 py-3 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20"
                  />
                    <span class="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-sm text-slate-500">kg</span>
                  </div>
                  <p id="weightError" role="alert" class="hidden mt-1 text-xs text-red-600"></p>
                </div>

                <div>
                  <label
                    for="size"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Size <span class="text-red-500">*</span>
                  </label>
                  <div id="sizeCombobox" class="relative">
                    <div class="relative">
                      <input
                        id="size"
                        name="size"
                        type="text"
                        placeholder="Select pet type first"
                        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 pr-12 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20 read-only:cursor-pointer disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-400"
                        role="combobox"
                        aria-autocomplete="none"
                        aria-controls="sizeOptions"
                        aria-expanded="false"
                        aria-invalid="false"
                        autocomplete="off"
                        readonly aria-required="true"
                        required
                        disabled
                      />
                      <button
                        id="sizeDropdownButton"
                        type="button"
                        class="absolute inset-y-0 right-0 flex w-12 items-center justify-center rounded-r-xl text-slate-500 transition hover:text-[#315b7e] focus:outline-none focus:ring-2 focus:ring-inset focus:ring-[#315b7e]/20 disabled:cursor-not-allowed disabled:text-slate-300"
                        aria-label="Show size options"
                        aria-controls="sizeOptions"
                        aria-expanded="false"
                        disabled
                      >
                        <svg class="ph-icon h-5 w-5" aria-hidden="true" viewBox="0 0 256 256" fill="currentColor" focusable="false"><use href="../../assets/icons/phosphor.svg?v=admin-icons-20261018#caret-down"></use></svg>
                      </button>
                    </div>
                    <div
                      id="sizeOptions"
                      class="absolute z-30 mt-1 hidden max-h-64 w-full overflow-y-auto rounded-xl border border-slate-200 bg-white py-1 shadow-lg"
                      role="listbox"
                      aria-label="Size options"
                    ></div>
                  </div>
                  <p id="sizeError" class="mt-2 hidden text-sm text-red-600"></p>
                </div>

                <div class="md:col-span-2">
                  <label
                    for="medicalNotes"
                    class="mb-2 block text-sm font-medium text-slate-700"
                  >
                    Medical Conditions / Special Needs <span class="text-slate-400 font-normal">(optional)</span>
                  </label>
                  <textarea
                    id="medicalNotes"
                    name="medicalNotes"
                    rows="4"
                    placeholder="Describe allergies, medical conditions, or special care instructions..."
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-[#315b7e] focus:ring-2 focus:ring-[#315b7e]/20"
                  ></textarea>
                </div>
              </div>

              <div class="flex justify-end">
                <button
                  id="savePetBtn"
                  type="submit"
                  class="rounded-2xl bg-[#315b7e] px-5 py-3 text-sm font-semibold text-white transition hover:bg-[#274864]"
                >
                  Add Pet
                </button>
              </div>
            </form>
          </section>

          <section class="mt-8 rounded-2xl bg-white/90 p-5 shadow-sm">
            <div class="mb-4 flex items-center justify-between gap-3">
              <div>
                <h3 class="text-lg font-bold text-[#2f4b66]">Selected Pets</h3>
              </div>
              <div
                id="selectedPetCount"
                class="rounded-full bg-[#edf5fc] px-3 py-1 text-xs font-semibold text-[#315b7e]"
              >
                0 / 10 selected
              </div>
            </div>

            <div
              id="selectedPetsEmptyState"
              class="rounded-2xl border border-dashed border-slate-300 bg-slate-50 p-6 text-center text-sm text-slate-500"
            >
              <p class="font-semibold text-slate-600">No pets added yet</p>
              <p class="mt-1">Add a pet to continue.</p>
            </div>

            <div id="selectedPetCards" class="grid gap-3 md:grid-cols-2"></div>
          </section>

          <div class="mt-8 flex items-center justify-between gap-4">
            <button
              id="backBtn"
              type="button"
              class="rounded-2xl border border-[#315b7e] px-5 py-3 text-sm font-semibold text-[#315b7e] transition hover:bg-[#edf5fc]"
            >
              Back
            </button>

            <button
              id="nextBtn"
              type="button"
              disabled
              class="cursor-not-allowed rounded-2xl bg-[#315b7e] px-6 py-3 text-sm font-semibold text-white opacity-50 transition"
            >
              Next Step
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="../../scripts/api.js?v=session-inactivity-20260828&release=grooming-pricing-20261006&auth=session-scope-20261006&capacity=20261010&clinic=roles-20261010&groomers=named-20261016&session=lock-20261018&navigation=20261018&admin-perf=20261019&session-presentation=walk-in-20261021&staff-access=20261024&veterinary=20261024&auth-races=20261024&security=single-session-20261025&activity=20261025&grooming=actual-20261026"></script>
    <script
      type="module"
      src="../../scripts/components/walk-in-pet-step.js?v=walk-in-owner-mode-20260924&walk-in=entry-context-20261015&release=grooming-pricing-20261006&capacity=20261010&pet-weight=pet-weight-size-20261011-v3&copy=grooming-terminology-20261016&consent=20261017&catalog=services-20261017-2&icons=20261018&session=walk-in-20261021&clinic-roles=20261024&nav=walk-in-home-20261025&pet-fields=20261026-v1&grooming=actual-20261026&registration=fcfs-20261027-v1&registration=fcfs-20261026-v1"
    ></script>
  </body>
</html>
