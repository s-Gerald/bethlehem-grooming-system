<div class="mt-4 space-y-3">
  <!-- Error alert -->
  <div x-show="error" style="display:none"
    class="flex items-start gap-3 rounded-2xl p-4 text-sm"
    style="background-color:#fee2e2;color:#b91c1c">

    <span x-text="error"></span>
  </div>
</div>

<div class="inventory-stock-layout mt-4">

  <!-- ── Step 1: Search item ─────────────────────────────────────── -->
  <div class="overflow-hidden rounded-2xl border border-[#e6eef7] bg-white shadow-sm">
    <div class="border-b border-[#e6eef7] px-5 py-4" style="background-color:#f8fafc">
      <p class="text-sm font-bold text-slate-700">Search Item</p>
    </div>
    <div class="p-5">

      <!-- Search bar (hidden once item selected) -->
      <div x-show="!selected" style="display:block">
        <div class="flex gap-2">
          <div class="relative flex-1">

            <input
              x-model="searchQuery"
              @input="onSearchInput()"
              @keyup.enter="onSearchEnter()"
              type="text"
              placeholder="Item name or barcode…"
              class="w-full rounded-xl border border-slate-200 py-2.5 pl-4 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-[#315b7e]/30"
            />
          </div>
          <button
            type="button" aria-label="Scan barcode"
            @click="openScanner()"
            title="Scan with camera"
            class="inline-flex shrink-0 items-center justify-center rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-slate-500 transition hover:border-[#315b7e] hover:text-[#315b7e]"
          >
            <svg class="ph-icon h-5 w-5" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="../../../assets/icons/phosphor.svg?v=inventory-icons-20261002#barcode"></use></svg>
          </button>
        </div>
        <!-- Dropdown results -->
        <div x-show="searchResults.length > 0" style="display:none"
          class="mt-1 overflow-hidden rounded-2xl border border-[#d7e3ef] bg-white shadow-lg">
          <template x-for="item in searchResults" :key="item.item_id">
            <button type="button" @click="pickItem(item)"
              class="flex w-full items-center justify-between px-4 py-3 text-sm transition hover:bg-[#eaf4fb]">
              <div class="min-w-0 text-left">
                <p class="truncate font-semibold text-slate-800" x-text="item.item_name"></p>
                <p class="text-xs capitalize text-slate-400" x-text="item.category?.replace('_',' ')"></p>
              </div>
              <span class="ml-3 shrink-0 text-xs text-slate-500">
                <span x-text="Math.trunc(Number(item.quantity_on_hand ?? 0))"></span> <span x-text="item.unit"></span> physical
                · <span x-text="item.unexpired_quantity ?? 0"></span> unexpired
              </span>
            </button>
          </template>
        </div>
        <p class="mt-1.5 text-xs text-slate-400">Type a barcode number, or scan a barcode or QR code.</p>
      </div>

      <!-- Selected item chip + entry form -->
      <div x-show="selected" style="display:none">
        <div class="mb-4 flex items-center gap-3 rounded-xl p-3" style="background-color:#eaf4fb">

          <div class="flex-1 min-w-0">
            <p class="truncate font-semibold text-[#1f3850]" x-text="selected?.item_name"></p>
            <p class="text-xs text-slate-500">
              Available for reason: <span class="font-semibold text-slate-700" x-text="availableForReason()"></span>
              <span x-text="selected?.unit"></span>
            </p>
          </div>
          <button type="button" @click="clearSelected()"
            class="shrink-0 rounded-full p-1.5 text-slate-400 transition hover:bg-white hover:text-red-500">

          Clear</button>
        </div>

        <!-- Fields -->
        <div class="space-y-4">
          <div class="grid gap-3 sm:grid-cols-3">
            <div>
              <label class="mb-1 block text-xs font-semibold text-slate-600">
                Quantity <span style="color:#ef4444" class="font-bold">*</span>
              </label>
              <input x-model="qty" data-qty-input type="number" step="1" min="1" inputmode="numeric" placeholder="0"
                class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#315b7e]/30" />
            </div>
            <div>
              <label class="mb-1 block text-xs font-semibold text-slate-600">
                Reason <span style="color:#ef4444" class="font-bold">*</span>
              </label>
              <select x-model="reason" @change="if (reason !== 'sold') sellingPrice = ''"
                class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#315b7e]/30">
                <option value="used">Used (service)</option>
                <option value="sold">Sold</option>
                <option value="damaged">Damaged</option>
                <template x-if="canUseExpired()">
                  <option value="expired">Expired</option>
                </template>
                <option value="adjustment">Adjustment</option>
              </select>
            </div>
            <div x-show="reason === 'sold'" x-cloak>
              <label class="mb-1 block text-xs font-semibold text-slate-600">
                Selling Price <span class="font-normal text-slate-400">(₱)</span>
              </label>
              <input :value="selected?.selling_price ?? ''" type="text" readonly aria-readonly="true" tabindex="-1"
                class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#315b7e]/30" />
            </div>
          </div>
          <div>
            <label class="mb-1 block text-xs font-semibold text-slate-600">
              Notes <span class="font-normal text-slate-400">(optional)</span>
            </label>
            <input x-model="notes" type="text" placeholder="Any additional info…"
              class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#315b7e]/30" />
          </div>

          <p x-show="entryError" style="display:none;color:#b91c1c" class="text-xs font-semibold" x-text="entryError"></p>

          <button type="button" @click="addToPending()"
            class="inline-flex items-center gap-2 rounded-xl px-5 py-2.5 text-sm font-semibold text-white transition"
            style="background-color:#315b7e">

            <span>Add to List</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- ── Step 2: Pending list ─────────────────────────────────────── -->
  <div
    class="overflow-hidden rounded-2xl border border-[#e6eef7] bg-white shadow-sm">
    <div class="flex items-center justify-between border-b border-[#e6eef7] px-5 py-4" style="background-color:#f8fafc">
      <p class="text-sm font-bold text-slate-700">Items to Stock Out</p>
      <span class="rounded-full px-2.5 py-0.5 text-xs font-bold"
        style="background-color:#fef3c7;color:#92400e"
        x-text="pending.length + ' item(s)'"></span>
    </div>
    <p x-show="!pending.length" class="px-5 py-6 text-sm text-slate-400">No items added yet.</p>
    <ul class="divide-y divide-[#e6eef7]">
      <template x-for="(p, idx) in pending" :key="idx">
        <li class="flex items-center gap-3 px-5 py-3.5">
          <div class="flex-1 min-w-0">
            <p class="truncate text-sm font-semibold text-slate-800" x-text="p.item_name"></p>
            <div class="mt-0.5 flex flex-wrap items-center gap-x-2 gap-y-0.5 text-xs text-slate-500">
              <span>
                <span x-text="p.quantity"></span>
                <span x-text="p.unit"></span>
              </span>
              <span class="capitalize" x-text="'· ' + p.reason"></span>
              <span x-show="p.selling_price" style="display:none">
                · ₱<span x-text="parseFloat(p.selling_price).toFixed(2)"></span>
              </span>
              <span x-show="p.notes" style="display:none" x-text="'· ' + p.notes"></span>
            </div>
          </div>
          <button type="button" @click="removePending(idx)"
            class="shrink-0 rounded-lg p-1.5 text-slate-400 transition hover:bg-red-50 hover:text-red-500">

          Remove</button>
        </li>
      </template>
    </ul>
  </div>

</div><!-- /inventory-stock-layout -->

<!-- ── Camera Scanner Modal ────────────────────────────────────────────── -->
<div x-cloak x-show="scannerActive" style="display:none;z-index:60;background-color:rgba(15,23,42,0.8)" x-transition
  class="fixed inset-0 flex items-center justify-center px-4">
  <div class="w-full max-w-sm overflow-hidden rounded-3xl bg-white shadow-2xl">
    <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
      <h4 class="font-bold text-slate-800">Scan Barcode</h4>
      <button type="button" @click="closeScanner()" class="text-slate-400 transition hover:text-red-500">

      Close</button>
    </div>
    <div class="p-4">
      <div id="stockout-qr-reader" class="w-full overflow-hidden rounded-xl"></div>
      <p class="mt-3 text-center text-xs text-slate-400">Point camera at barcode or QR code</p>
    </div>
  </div>
</div>

<!-- ── Sticky submit bar ─────────────────────────────────────────────── -->
<div class="fixed bottom-0 left-0 right-0 z-40 border-t border-[#d7e3ef] bg-white px-4 py-3 shadow-lg lg:left-[280px]">
  <div class="inventory-stock-submit mx-auto flex items-center justify-between gap-4">
    <div class="min-w-0">
      <p x-show="!pending.length" class="text-sm text-slate-400">Add at least one item above, then submit.</p>
      <p x-show="pending.length > 0" style="display:none" class="text-sm font-semibold text-slate-700">
        <span x-text="pending.length"></span> item(s) ready to record
      </p>
    </div>
    <button
      type="button"
      @click="submit()"
      :disabled="submitting || !pending.length"
      class="inline-flex shrink-0 items-center gap-2 rounded-xl px-5 py-2.5 text-sm font-semibold text-white transition"
      style="background-color:#d97706"
      :style="(submitting || !pending.length) ? 'background-color:#d97706;opacity:0.5;cursor:not-allowed' : 'background-color:#d97706'"
    >

      <span>Record Stock Out</span>
    </button>
  </div>
</div>
