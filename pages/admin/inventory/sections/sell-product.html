<div class="pos-workflow">
  <div class="pos-layout">
    <fieldset class="pos-left pos-fields" :disabled="submitting || validating || receiptOpen || !!onlinePayment" :aria-busy="submitting || validating" aria-label="Products and cart">
      <section class="pos-panel" aria-labelledby="pos-search-title" @click.outside="productDropdown?.close()" @focusout="if (!$el.contains($event.relatedTarget)) productDropdown?.close()">
        <label id="pos-search-title" for="pos-product-search">Search or scan product</label>
        <div class="pos-search-input">
        <input class="product-search-input" id="pos-product-search" x-ref="productSearch" x-model="searchQuery" @input="onSearchInput()"
          role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-controls="pos-product-results" :aria-expanded="Boolean(productDropdown?.open)" :aria-activedescendant="productDropdown?.open &amp;&amp; productDropdown?.activeId != null ? 'pos-product-option-' + productDropdown.activeId : null" @focus="focusProducts()" @keydown="productKey($event)"
          type="search" placeholder="Product name or barcode" autocomplete="off" />
        <button type="button" class="pos-scan-button" @click="openScanner()" aria-label="Scan barcode" aria-haspopup="dialog" :aria-expanded="scannerActive">
          <svg class="ph-icon" viewBox="0 0 256 256" aria-hidden="true"><use href="../../../assets/icons/phosphor.svg?v=admin-icons-20261018#barcode"></use></svg>
        </button>
        </div>
        <p class="pos-helper">Medicine and Vaccine are excluded from retail sales.</p>
        <div x-ref="productPopup" x-cloak x-show="productDropdown?.open" :style="productDropdown?.style" class="product-search-popup">
          <p class="product-search-heading" x-text="searchQuery.trim() ? 'Search Results' : ('Suggested Products')"></p>
          <div id="pos-product-results" role="listbox" aria-label="Product suggestions" class="product-search-list" :style="productDropdown?.listStyle" :aria-busy="Boolean(searching)">
            <template x-for="item in searchResults" :key="item.item_id">
              <div role="option" :id="'pos-product-option-' + item.item_id" :data-product-id="item.item_id" :aria-disabled="!hasProductStock(item)" :aria-selected="productDropdown?.activeId === item.item_id" @mousedown.prevent @click="addToCart(item)" class="product-search-option" :title="item.item_name">
                <span class="product-search-identity"><span class="product-search-name" x-text="item.item_name"></span><span class="product-search-meta" x-text="hasProductStock(item) ? Math.floor(Number(item.saleable_quantity)) + ' available · ' + item.unit : productStockLabel(item)"></span></span>
                <span x-show="hasProductStock(item)" class="product-search-price" x-text="'₱' + fmt(item.selling_price)"></span>
              </div>
            </template>
          </div>
          <p x-show="searching" role="status" class="product-search-message">Loading…</p>
          <p x-show="!error &amp;&amp; noResults" role="status" class="product-search-message" x-text="'No matching products'"></p>
        </div>
      </section>
      <section class="pos-panel" aria-labelledby="pos-cart-title">
        <div class="pos-panel-heading"><h3 id="pos-cart-title">Cart</h3><button type="button" class="pos-text-button" x-show="cart.length" @click="clearCart()">Clear All</button></div>
        <p x-show="!cart.length" class="pos-empty" x-text="onlinePayment ? 'Restoring payment cart…' : 'Search for a product to start a sale.'"></p>
        <template x-for="(line, index) in cart" :key="line.item_id">
          <div class="pos-cart-line">
            <div class="pos-line-product"><strong x-text="line.item_name"></strong><span x-text="'₱' + fmt(line.price) + ' / ' + line.unit"></span></div>
            <label class="pos-quantity"><span>Quantity</span><input x-model="line.quantity" @input="updateLineSubtotal(line)" type="number" min="1" step="1" :max="Math.floor(line.stock)" :aria-label="'Quantity for ' + line.item_name" :aria-invalid="Boolean(lineError(line))" :aria-describedby="'pos-line-error-' + line.item_id" /></label>
            <strong class="pos-line-total" x-text="'₱' + fmt(line.subtotal)"></strong>
            <button type="button" class="pos-remove" @click="removeFromCart(index)" :aria-label="'Remove ' + line.item_name">
              <svg class="ph-icon" viewBox="0 0 256 256" aria-hidden="true"><use href="../../../assets/icons/phosphor.svg?v=admin-icons-20261018#x"></use></svg>
            </button>
            <p x-show="lineError(line)" :id="'pos-line-error-' + line.item_id" class="pos-line-error" x-text="lineError(line)"></p>
          </div>
        </template>
        <p x-show="notice" role="status" class="pos-notice" x-text="notice"></p>
      </section>
    </fieldset>
    <section class="pos-panel pos-summary" aria-labelledby="pos-payment-title">
      <h3 id="pos-payment-title">Order Summary</h3>
      <dl class="pos-summary-values">
        <div><dt>Subtotal</dt><dd x-text="'₱' + fmt(onlinePayment?.amount ?? totalAmount)"></dd></div>
        <div class="pos-total"><dt>Total</dt><dd x-text="'₱' + fmt(onlinePayment?.amount ?? totalAmount)"></dd></div>
      </dl>
      <fieldset class="pos-fields" :disabled="submitting || validating || receiptOpen || !!onlinePayment" :aria-busy="submitting || validating" aria-label="Payment information">
      <div class="pos-payment-methods" role="group" aria-labelledby="pos-payment-method-title">
        <p id="pos-payment-method-title">Payment Method</p>
        <label class="pos-payment-option" :class="{'pos-payment-selected': paymentMethod === 'cash'}">
          <input type="radio" name="pos-payment-method" value="cash" x-model="paymentMethod" />
          <span>Cash</span>
        </label>
        <label class="pos-payment-option" :class="{'pos-payment-selected': paymentMethod === 'online'}"><input type="radio" name="pos-payment-method" value="online" x-model="paymentMethod" /><span>Online Payment</span></label>
      </div>
      <div x-show="paymentMethod === 'cash'">
      <label for="pos-cash">Cash Received</label>
      <input data-money-input id="pos-cash" x-model="amountTendered" type="number" step="0.01" :min="totalAmount" :max="paymentMaximumAmount" placeholder="0.00" inputmode="decimal" x-effect="enforcePaymentAmountLimit()" @input="enforcePaymentAmountLimit($event)" aria-describedby="pos-cash-help" :aria-invalid="amountTendered !== '' && Boolean(cashError)" />
      <p id="pos-cash-help" x-show="amountTendered !== '' && cashError" class="pos-helper pos-cash-error" role="status" x-text="cashError"></p>
      <dl class="pos-summary-values"><div><dt>Change</dt><dd x-text="'₱' + fmt(changeAmount)"></dd></div></dl>
      </div>
      <label for="pos-notes">Notes <span class="pos-helper">(optional)</span></label>
      <input id="pos-notes" x-model="notes" maxlength="500" type="text" />
      <p x-show="totalAmount > 999999.99" class="pos-error">The total exceeds ₱999,999.99. Reduce the cart before continuing.</p>
      <button x-show="!onlinePayment || openingCheckout" type="button" @click="processSale()" :disabled="submitting || !canProcess" class="pos-button pos-primary" x-text="validating ? 'Checking stock and prices…' : submitting ? (paymentMethod === 'cash' ? 'Processing…' : 'Opening checkout…') : paymentMethod === 'cash' ? 'Complete Sale' : 'Create Online Payment'"></button>
      </fieldset>
      <div x-ref="paymentStatus" tabindex="-1" x-cloak x-show="onlinePayment && !openingCheckout" class="pos-payment-status" :aria-busy="submitting">
        <div role="status" aria-live="polite" aria-atomic="true">
          <h4 x-text="posPaymentTitle"></h4>
          <p class="pos-helper" x-text="posPaymentMessage"></p>
        </div>
        <button x-show="canOpenPosCheckout" type="button" class="pos-button pos-primary" @click="openPosCheckout()" :disabled="submitting">Open Checkout</button>
        <div class="pos-payment-actions">
          <button type="button" class="pos-text-button" @click="checkPosPaymentStatus()" :disabled="submitting" x-text="submitting && !_posCancelling ? 'Checking…' : 'Check Status'"></button>
          <button x-show="onlinePayment?.id && onlinePayment?.status === 'pending'" type="button" class="pos-text-button" @click="cancelPosOnlinePayment()" :disabled="submitting" x-text="_posCancelling ? 'Cancelling…' : 'Cancel Online Payment'"></button>
        </div>
      </div>
      <div x-show="error" class="pos-error">
        <p role="alert" x-text="error"></p>
        <button type="button" x-show="validationFailed" class="pos-text-button" @click="revalidateCart()" :disabled="submitting || validating || !!onlinePayment" x-text="validating ? 'Checking…' : 'Retry'"></button>
      </div>
    </section>
  </div>

  <dialog class="pos-scanner-dialog" aria-labelledby="pos-scanner-title" x-effect="scannerActive ? $el.showModal() : $el.close()" @cancel.prevent="closeScanner()">
      <div class="pos-panel-heading"><h3 id="pos-scanner-title">Scan Barcode</h3><button type="button" class="pos-text-button" @click="closeScanner()">Close</button></div>
      <div id="pos-qr-reader"></div>
      <p class="pos-helper">Point camera at barcode or QR code</p>
  </dialog>

  <dialog x-ref="successDialog" class="pos-success-dialog" aria-labelledby="pos-success-title" @cancel.prevent="newSale()">
    <template x-if="receipt">
      <div class="pos-success-content">
        <svg class="pos-success-icon ph-icon" viewBox="0 0 256 256" aria-hidden="true"><use href="../../../assets/icons/phosphor.svg?v=admin-icons-20261018#check-circle"></use></svg>
        <h3 id="pos-success-title">Sale completed</h3>
        <p class="pos-success-total" x-text="'₱' + fmt(receipt.total_amount)"></p>
        <p class="pos-helper">Amount Paid</p>
        <p class="pos-success-reference" x-text="receipt.reference"></p>
        <p class="pos-helper" x-text="saleDate(receipt.created_at)"></p>
        <dl class="pos-summary-values">
          <div><dt>Payment method</dt><dd x-text="receipt.payment_method_label || 'Cash'"></dd></div>
          <div x-show="(receipt.payment_method || 'cash') === 'cash'"><dt>Cash received</dt><dd x-text="'₱' + fmt(receipt.amount_tendered)"></dd></div>
          <div x-show="(receipt.payment_method || 'cash') === 'cash'" class="pos-change"><dt>Change</dt><dd x-text="'₱' + fmt(receipt.change_amount)"></dd></div>
        </dl>
        <button type="button" class="pos-button pos-primary" @click="printInvoice()" autofocus>Print Invoice</button>
        <button type="button" class="pos-button pos-secondary" @click="newSale()">New Sale</button>
      </div>
    </template>
  </dialog>
  <template x-if="receipt"><div class="receipt-print-source" aria-hidden="true" x-html="window.ProductSaleInvoice.template"></div></template>
</div>
