<p x-cloak x-show="error" class="admin-load-error" role="alert"><span x-text="error"></span><button type="button" @click="load()">Retry</button></p>

<!-- Loading -->
<admin-loader x-cloak x-show="loading &amp;&amp; !loaded"></admin-loader>

<div x-show="loaded">
  <!-- Summary -->
  <div class="mt-6 grid gap-4 sm:grid-cols-3">
    <div class="rounded-2xl border border-[#e6eef7] bg-white p-5 shadow-sm">
      <p class="text-sm font-semibold text-slate-500">Products</p>
      <p class="mt-3 text-3xl font-extrabold text-slate-800" x-text="totalItems"></p>
    </div>
    <div class="rounded-2xl border border-[#e6eef7] bg-white p-5 shadow-sm">
      <p class="text-sm font-semibold text-slate-500">Low Stock</p>
      <p class="mt-3 text-3xl font-extrabold text-slate-800" x-text="lowStockCount"></p>
    </div>
    <div class="rounded-2xl border border-[#e6eef7] bg-white p-5 shadow-sm">
      <p class="text-sm font-semibold text-slate-500">Expiring Soon</p>
      <p class="mt-3 text-3xl font-extrabold text-slate-800" x-text="expiryCount"></p>
    </div>
  </div>

  <!-- Alert tabs -->
  <div class="mt-6">
    <h3 class="mb-3 text-sm font-bold uppercase tracking-wide text-slate-500">Inventory Alerts</h3>
    <div class="flex gap-1 rounded-2xl bg-white/60 p-1 w-fit border border-[#e6eef7]">
      <button type="button" @click="activeTab='low_stock'"
        class="rounded-xl px-5 py-2 text-sm font-semibold transition"
        :class="activeTab==='low_stock' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'">
        Low Stock
        <span x-show="lowStockCount > 0" style="display:none"
          class="ml-1.5 rounded-full px-1.5 py-0.5 text-xs font-bold"
          style="background-color:#fee2e2;color:#b91c1c" x-text="lowStockCount"></span>
      </button>
      <button type="button" @click="activeTab='expiry'"
        class="rounded-xl px-5 py-2 text-sm font-semibold transition"
        :class="activeTab==='expiry' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'">
        Expiry
        <span x-show="expiryCount > 0" style="display:none"
          class="ml-1.5 rounded-full px-1.5 py-0.5 text-xs font-bold"
          style="background-color:#fee2e2;color:#b91c1c" x-text="expiryCount"></span>
      </button>
    </div>

    <!-- Low stock list -->
    <div x-show="activeTab==='low_stock'" class="mt-3 overflow-hidden rounded-2xl border border-[#e6eef7] bg-white shadow-sm">
      <template x-if="lowStockItems.length === 0">
        <p class="px-4 py-8 text-center text-sm text-slate-400">All items are sufficiently stocked.</p>
      </template>
      <table x-show="lowStockItems.length > 0" class="w-full text-sm">
        <thead><tr class="border-b border-[#e6eef7] bg-[#f5f8fb] text-left text-xs font-bold uppercase tracking-wide text-slate-500">
          <th class="px-4 py-3">Item</th>
          <th class="px-4 py-3 hidden sm:table-cell">Category</th>
          <th class="px-4 py-3">Stock</th>
          <th class="px-4 py-3">Min Stock</th>
          <th class="px-4 py-3 text-right hidden sm:table-cell">Action</th>
        </tr></thead>
        <tbody class="divide-y divide-[#e6eef7]">
          <template x-for="item in lowStockItems" :key="item.item_id">
            <tr class="hover:bg-[#f5f8fb] transition">
              <td class="px-4 py-3 font-semibold text-slate-800" x-text="item.item_name"></td>
              <td class="px-4 py-3 hidden sm:table-cell">
                <span class="rounded-full px-2.5 py-0.5 text-xs font-semibold" style="background-color:#e0f2fe;color:#0369a1" x-text="item.category?.replace('_',' ')"></span>
              </td>
              <td class="px-4 py-3 font-bold" style="color:#d97706">
                <span x-text="fmtQty(item.quantity_on_hand)"></span>
                <span class="text-xs text-slate-400 ml-0.5" x-text="item.unit"></span>
              </td>
              <td class="px-4 py-3 text-slate-500">
                <span x-text="fmtQty(item.reorder_level)"></span>
                <span class="text-xs text-slate-400 ml-0.5" x-text="item.unit"></span>
              </td>
              <td class="px-4 py-3 text-right hidden sm:table-cell">
                <a href="#stock-in" class="text-xs font-semibold text-[#315b7e] hover:underline">Restock</a>
              </td>
            </tr>
          </template>
        </tbody>
      </table>

    </div>

    <div x-show="activeTab==='low_stock'" class="mt-3 text-right">
      <a href="#products?filter=low-stock" class="text-sm font-semibold text-[#315b7e] hover:underline">View all low-stock products →</a>
    </div>

    <!-- Expiry list -->
    <div x-show="activeTab==='expiry'" style="display:none" class="mt-3 overflow-hidden rounded-2xl border border-[#e6eef7] bg-white shadow-sm">
      <template x-if="expiryItems.length === 0">
        <p class="px-4 py-8 text-center text-sm text-slate-400">No items expiring within 30 days.</p>
      </template>
      <table x-show="expiryItems.length > 0" class="w-full text-sm">
        <thead><tr class="border-b border-[#e6eef7] bg-[#f5f8fb] text-left text-xs font-bold uppercase tracking-wide text-slate-500">
          <th class="px-4 py-3">Item</th>
          <th class="px-4 py-3 hidden sm:table-cell">Batch</th>
          <th class="px-4 py-3">Expiry Date</th>
          <th class="px-4 py-3">Status</th>
        </tr></thead>
        <tbody class="divide-y divide-[#e6eef7]">
          <template x-for="(item, index) in expiryItems" :key="item.item_id + '-' + index">
            <tr class="hover:bg-[#f5f8fb] transition">
              <td class="px-4 py-3 font-semibold text-slate-800" x-text="item.item_name"></td>
              <td class="px-4 py-3 hidden sm:table-cell text-slate-500 font-mono text-xs" x-text="item.batch_number || '—'"></td>
              <td class="px-4 py-3 text-slate-600" x-text="item.earliest_expiry || '—'"></td>
              <td class="px-4 py-3">
                <span class="rounded-full px-2.5 py-0.5 text-xs font-semibold" :style="expiryStyle(item)" x-text="expiryLabel(item)"></span>
              </td>
            </tr>
          </template>
        </tbody>
      </table>

    </div>
  </div>

  <div x-show="activeTab==='expiry'" class="mt-3 text-right">
    <a href="#products?filter=expiry" class="text-sm font-semibold text-[#315b7e] hover:underline">View all expiry alerts →</a>
  </div>

  <!-- Recent transactions -->
  <div class="mt-6">
    <h3 class="mb-3 text-sm font-bold uppercase tracking-wide text-slate-500">Recent Activity</h3>
    <div class="overflow-hidden rounded-2xl border border-[#e6eef7] bg-white shadow-sm">
      <template x-if="recentTransactions.length === 0">
        <p class="px-4 py-8 text-center text-sm text-slate-400">No transactions recorded yet.</p>
      </template>
      <table x-show="recentTransactions.length > 0" class="w-full text-sm">
        <thead><tr class="border-b border-[#e6eef7] bg-[#f5f8fb] text-left text-xs font-bold uppercase tracking-wide text-slate-500">
          <th class="px-4 py-3">Item</th>
          <th class="px-4 py-3">Type</th>
          <th class="px-4 py-3 hidden sm:table-cell">Qty</th>
          <th class="px-4 py-3 hidden lg:table-cell">Processed By</th>
          <th class="px-4 py-3 hidden md:table-cell">Date</th>
        </tr></thead>
        <tbody class="divide-y divide-[#e6eef7]">
          <template x-for="tx in recentTransactions" :key="tx.transaction_id">
            <tr class="hover:bg-[#f5f8fb] transition">
              <td class="px-4 py-3 font-semibold text-slate-800"><span x-text="tx.item_name ?? tx.item?.item_name ?? '—'"></span><p x-show="tx.source_label" class="mt-1 text-xs font-semibold text-[#315b7e]" x-text="tx.source_label"></p></td>
              <td class="px-4 py-3"><span class="rounded-full px-2.5 py-0.5 text-xs font-semibold" :style="typeStyle(tx.type)" x-text="tx.type==='stock_in'?'Stock In':'Stock Out'"></span><p x-show="tx.reason === 'sold'" class="mt-1 text-xs text-emerald-700">Sold</p></td>
              <td class="px-4 py-3 hidden sm:table-cell text-slate-600" x-text="(tx.type === 'stock_out' ? '−' : '+') + fmtQty(tx.quantity) + ' ' + (tx.unit || '')"></td>
              <td class="px-4 py-3 hidden lg:table-cell text-xs text-slate-500" x-text="tx.performed_by_name ?? '—'"></td>
              <td class="px-4 py-3 hidden md:table-cell text-slate-400 text-xs" x-text="fmtDate(tx.created_at)"></td>
            </tr>
          </template>
        </tbody>
      </table>

    </div>
    <div class="mt-3 text-right">
      <a href="#history" class="text-sm font-semibold text-[#315b7e] hover:underline">View full history →</a>
    </div>
  </div>

</div>
