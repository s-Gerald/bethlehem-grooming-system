<p x-cloak x-show="error" class="admin-load-error" role="alert"><span x-text="error"></span><button type="button" @click="load()">Retry</button></p>

<!-- Loading -->
<admin-loader x-cloak x-show="loading &amp;&amp; !loaded"></admin-loader>

<div x-show="loaded" class="inventory-overview">
  <!-- Summary -->
  <div class="inventory-summary">
    <a href="#products" class="inventory-summary-card">
      <span class="inventory-summary-title">Products</span>
      <svg class="ph-icon inventory-summary-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/assets/icons/phosphor.svg?v=inventory-icons-20261002#package"></use></svg>
      <span class="inventory-summary-count" x-text="totalItems"></span>
    </a>
    <button type="button" @click="showAlert('low_stock')" class="inventory-summary-card" aria-controls="inventory-low-stock" :aria-pressed="activeTab === 'low_stock'">
      <span class="inventory-summary-title">Low Stock</span>
      <svg class="ph-icon inventory-summary-icon inventory-summary-warning" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/assets/icons/phosphor.svg?v=inventory-icons-20261002#warning"></use></svg>
      <span class="inventory-summary-count" x-text="lowStockCount"></span>
    </button>
    <button type="button" @click="showAlert('expiry')" class="inventory-summary-card" aria-controls="inventory-expiry" :aria-pressed="activeTab === 'expiry'">
      <span class="inventory-summary-title">Expiry Alerts</span>
      <svg class="ph-icon inventory-summary-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/assets/icons/phosphor.svg?v=inventory-icons-20261002#calendar-dots"></use></svg>
      <span class="inventory-summary-count" x-text="expiryCount"></span>
    </button>
  </div>

  <!-- Alert tabs -->
  <div x-ref="alerts" class="mt-6">
    <h3 class="mb-3 text-sm font-bold uppercase tracking-wide text-slate-500">Inventory Alerts</h3>
    <div class="flex gap-1 rounded-2xl bg-white/60 p-1 w-fit border border-[#e6eef7]">
      <button type="button" @click="activeTab='low_stock'" :aria-pressed="activeTab === 'low_stock'"
        class="rounded-xl px-5 py-2 text-sm font-semibold transition"
        :class="activeTab==='low_stock' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'">
        Low Stock
        <span x-show="lowStockCount > 0" style="display:none"
          class="ml-1.5 rounded-full px-1.5 py-0.5 text-xs font-bold"
          style="background-color:#fee2e2;color:#b91c1c" x-text="lowStockCount"></span>
      </button>
      <button type="button" @click="activeTab='expiry'" :aria-pressed="activeTab === 'expiry'"
        class="rounded-xl px-5 py-2 text-sm font-semibold transition"
        :class="activeTab==='expiry' ? 'bg-[#315b7e] text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'">
        Expiry
        <span x-show="expiryCount > 0" style="display:none"
          class="ml-1.5 rounded-full px-1.5 py-0.5 text-xs font-bold"
          style="background-color:#fee2e2;color:#b91c1c" x-text="expiryCount"></span>
      </button>
    </div>

    <!-- Low stock list -->
    <div id="inventory-low-stock" role="region" aria-label="Low stock products" tabindex="0" x-show="activeTab==='low_stock'" class="inventory-table-scroll mt-3 overflow-hidden rounded-2xl border border-[#e6eef7] bg-white shadow-sm">
      <template x-if="lowStockItems.length === 0">
        <p class="px-4 py-8 text-center text-sm text-slate-400">All items are sufficiently stocked.</p>
      </template>
      <table x-show="lowStockItems.length > 0" class="inventory-overview-table" :class="{'inventory-overview-table--readonly': clinicOnly}">
        <thead><tr class="border-b border-[#e6eef7] bg-[#f5f8fb] text-left text-xs font-bold uppercase tracking-wide text-slate-500">
          <th scope="col" class="px-4 py-3">Item</th>
          <th scope="col" class="px-4 py-3">Category</th>
          <th scope="col" class="px-4 py-3">Usable Stock</th>
          <th scope="col" class="px-4 py-3">Min Stock</th>
          <th scope="col" x-show="!clinicOnly" class="px-4 py-3 inventory-action-cell">Action</th>
        </tr></thead>
        <tbody class="divide-y divide-[#e6eef7]">
          <template x-for="item in lowStockItems" :key="item.item_id">
            <tr class="hover:bg-[#f5f8fb] transition">
              <td class="px-4 py-3 font-semibold text-slate-800"><a href="#products?filter=low-stock" class="hover:underline focus-visible:underline" x-text="item.item_name"></a></td>
              <td class="px-4 py-3">
                <span class="rounded-full px-2.5 py-0.5 text-xs font-semibold" style="background-color:#e0f2fe;color:#0369a1" x-text="item.category?.replace('_',' ')"></span>
              </td>
              <td class="px-4 py-3 font-bold" style="color:#d97706">
                <span x-text="fmtQty(item.usable_quantity)"></span>
                <span class="text-xs text-slate-400 ml-0.5" x-text="item.unit"></span>
              </td>
              <td class="px-4 py-3 text-slate-500">
                <span x-text="fmtQty(item.reorder_level)"></span>
                <span class="text-xs text-slate-400 ml-0.5" x-text="item.unit"></span>
              </td>
              <td x-show="!clinicOnly" class="px-4 py-3 inventory-action-cell">
                <a :href="inventoryStockHref('stock-in', item.item_id)" class="inventory-icon-action" title="Restock" :aria-label="'Restock ' + item.item_name">
                  <svg class="ph-icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/assets/icons/phosphor.svg?v=inventory-icons-20261002#plus"></use></svg>
                </a>
              </td>
            </tr>
          </template>
        </tbody>
      </table>

    </div>

    <!-- Expiry list -->
    <div id="inventory-expiry" role="region" aria-label="Expiry alerts" tabindex="0" x-show="activeTab==='expiry'" style="display:none" class="inventory-table-scroll mt-3 overflow-hidden rounded-2xl border border-[#e6eef7] bg-white shadow-sm">
      <template x-if="expiryItems.length === 0">
        <p class="px-4 py-8 text-center text-sm text-slate-400">No items expiring within 30 days.</p>
      </template>
      <table x-show="expiryItems.length > 0" class="inventory-overview-table inventory-overview-table--expiry">
        <thead><tr class="border-b border-[#e6eef7] bg-[#f5f8fb] text-left text-xs font-bold uppercase tracking-wide text-slate-500">
          <th scope="col" class="px-4 py-3">Item</th>
          <th scope="col" class="px-4 py-3">Batch</th>
          <th scope="col" class="px-4 py-3">Expiry Date</th>
          <th scope="col" class="px-4 py-3">Status</th>
        </tr></thead>
        <tbody class="divide-y divide-[#e6eef7]">
          <template x-for="(item, index) in expiryItems" :key="item.item_id + '-' + index">
            <tr class="hover:bg-[#f5f8fb] transition">
              <td class="px-4 py-3 font-semibold text-slate-800"><a href="#products?filter=expiry" class="hover:underline focus-visible:underline" x-text="item.item_name"></a></td>
              <td class="px-4 py-3 text-slate-500 font-mono text-xs" x-text="item.batch_number || '—'"></td>
              <td class="px-4 py-3 text-slate-600" x-text="item.earliest_expiry || '—'"></td>
              <td class="px-4 py-3">
                <span class="rounded-full px-2.5 py-0.5 text-xs font-semibold" :style="expiryStyle(item)" x-text="expiryLabel(item)"></span>
              </td>
            </tr>
          </template>
        </tbody>
      </table>

    </div>
  </div>

  <!-- Recent transactions -->
  <div x-cloak x-show="!clinicOnly" class="mt-6">
    <h3 class="mb-3 text-sm font-bold uppercase tracking-wide text-slate-500">Recent Activity</h3>
    <div role="region" aria-label="Recent inventory activity" tabindex="0" class="inventory-table-scroll overflow-hidden rounded-2xl border border-[#e6eef7] bg-white shadow-sm">
      <template x-if="recentTransactions.length === 0">
        <p class="px-4 py-8 text-center text-sm text-slate-400">No transactions recorded yet.</p>
      </template>
      <table x-show="recentTransactions.length > 0" class="inventory-overview-table">
        <thead><tr class="border-b border-[#e6eef7] bg-[#f5f8fb] text-left text-xs font-bold uppercase tracking-wide text-slate-500">
          <th scope="col" class="px-4 py-3">Item</th>
          <th scope="col" class="px-4 py-3">Reason</th>
          <th scope="col" class="px-4 py-3">Qty</th>
          <th scope="col" class="px-4 py-3">Processed By</th>
          <th scope="col" class="px-4 py-3">Date</th>
        </tr></thead>
        <tbody class="divide-y divide-[#e6eef7]">
          <template x-for="tx in recentTransactions" :key="tx.transaction_id">
            <tr class="hover:bg-[#f5f8fb] transition">
              <td class="px-4 py-3 font-semibold text-slate-800"><span x-text="tx.item_name ?? tx.item?.item_name ?? '—'"></span><p x-show="tx.source_label" class="mt-1 text-xs font-semibold text-[#315b7e]" x-text="tx.source_label"></p></td>
              <td class="px-4 py-3"><span class="inline-block rounded-full px-2.5 py-0.5 text-xs font-semibold" :style="reasonStyle(tx.reason)" x-text="reasonLabel(tx.reason)"></span></td>
              <td class="px-4 py-3 text-slate-600" x-text="(tx.type === 'stock_out' ? '−' : '+') + fmtQty(tx.quantity) + ' ' + (tx.unit || '')"></td>
              <td class="px-4 py-3 text-xs text-slate-500" x-text="tx.performed_by_name ?? '—'"></td>
              <td class="px-4 py-3 text-slate-400 text-xs" x-text="fmtDate(tx.created_at)"></td>
            </tr>
          </template>
        </tbody>
      </table>

    </div>
  </div>

</div>
